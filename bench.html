<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Instrument bench — every sound in the catalogue</title>
    <meta
      name="description"
      content="A keyboard for the whole instrument catalogue: every soundfont bank behind each General MIDI program, and the note envelope, settled by ear."
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#15171a" />
    <link rel="canonical" href="https://midi.poppodi.click/bench.html" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Radio — music generator" />
    <meta property="og:title" content="Instrument bench — every sound in the catalogue" />
    <meta
      property="og:description"
      content="A keyboard for the whole instrument catalogue: every soundfont bank behind each General MIDI program, and the note envelope, settled by ear."
    />
    <meta property="og:url" content="https://midi.poppodi.click/bench.html" />
    <meta property="og:image" content="https://midi.poppodi.click/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Radio — a rule-based generator for iskelmä, jazz and ambient" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      :root {
        --bg: #15171a; --ink: #e8e4de; --dim: #8d8880; --hot: #e0a24a;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      /* No tap flash: Android's Chrome paints a blue rectangle over whatever a
         finger lands on, and it lands on the keys. */
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      body {
        margin: 0; background: var(--bg); color: var(--ink);
        padding: 1rem; font-size: .82rem; line-height: 1.5;
      }
      main { max-width: 62rem; margin: 0 auto; display: grid; gap: 1rem; }
      h1 { font-size: 1rem; font-weight: 500; margin: 0; }
      h1 small { color: var(--dim); font-weight: 400; }
      select, button, input[type="range"] {
        background: #23262b; color: var(--ink); border: 1px solid #3a3e45;
        border-radius: 6px; padding: .35rem .6rem; font: inherit; cursor: pointer;
      }
      button:hover, select:hover { border-color: var(--hot); }
      .row { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
      label { color: var(--dim); display: flex; gap: .4rem; align-items: center; }
      label span { color: var(--ink); min-width: 2.6rem; font-variant-numeric: tabular-nums; }
      input[type="range"] { padding: 0; width: 9rem; cursor: grab; }

      /* The keyboard: white keys in flow, black keys overlapping between them. */
      #keys { display: flex; position: relative; height: 8rem; user-select: none; }
      .key {
        flex: 1 0 auto; background: #ddd8d0; color: #55504a; border: 1px solid #15171a;
        border-radius: 0 0 4px 4px; padding: 0 0 .4rem; font-size: .62rem;
        display: flex; align-items: flex-end; justify-content: center;
      }
      .key:active { background: var(--hot); }
      .key.black {
        background: #26292e; color: var(--dim); height: 62%;
        flex: 0 0 0; width: 1.6rem; margin: 0 -.8rem; z-index: 1;
      }
      .key.black:active { background: var(--hot); }
      /* Outside the instrument's range: playable here, never written by the generator. */
      .key.out { opacity: .32; }

      #facts { color: var(--dim); white-space: pre-wrap; line-height: 1.8; }
      #facts b { color: var(--ink); font-weight: 500; }
      pre {
        background: #1b1e22; border: 1px solid #2c3036; border-radius: 6px;
        padding: .7rem .9rem; margin: 0; overflow-x: auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .76rem;
        color: var(--ink);
      }
      .note { color: var(--dim); margin: 0; }
      .warn { color: #e2705a; }
      a { color: var(--hot); }
    </style>
  </head>
  <body>
    <main>
      <h1>
        Instrument bench
        <small>— click a key, or play the home row. Space strikes the centre note.</small>
      </h1>

      <div class="row">
        <label>instrument <select id="instrument"></select></label>
        <label>bank <select id="bank"></select></label>
        <label>plays <select id="phrase"></select></label>
        <button id="again">play</button>
        <button id="sweep">sweep all banks</button>
      </div>

      <div id="keys"></div>

      <div class="row">
        <label>attack <input type="range" id="attack" min="0" max="1" step="0.002" /><span></span></label>
        <label>decay <input type="range" id="decay" min="0" max="6" step="0.01" /><span></span></label>
        <label>sustain <input type="range" id="sustain" min="0" max="1" step="0.01" /><span></span></label>
        <label>release <input type="range" id="release" min="0" max="2" step="0.01" /><span></span></label>
        <button id="reset">back to catalogue</button>
      </div>

      <div id="facts"></div>

      <p class="note">
        Paste into <code>src/style/instruments.ts</code> once it sounds right. A bank
        other than 0 needs <code>.n()</code> in the renderer first — nothing emits it yet.
      </p>
      <pre id="code"></pre>
    </main>
    <script type="module" src="/src/web/bench.ts"></script>
  </body>
</html>
