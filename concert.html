<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Concert — a generated song, played on stage</title>
    <meta
      name="description"
      content="A generated song performed on a 3D stage by a three-piece band, choreographed from the very notes the music is made of — nothing is mimed."
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0908" />
    <link rel="canonical" href="https://midi.poppodi.click/concert.html" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Radio — music generator" />
    <meta property="og:title" content="Concert — a generated song, played on stage" />
    <meta
      property="og:description"
      content="A generated song performed on a 3D stage by a three-piece band, choreographed from the very notes the music is made of — nothing is mimed."
    />
    <meta property="og:url" content="https://midi.poppodi.click/concert.html" />
    <meta property="og:image" content="https://midi.poppodi.click/og-concert.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A three-piece band under four spotlights on a lit stage, one tomato already in the air" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      :root {
        --bg: #0b0908;
        --ink: #efe6dc;
        --dim: #a2938a;
        --hot: #e0a24a;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      /* No tap flash: Android's Chrome paints a blue rectangle over whatever a
         finger lands on, and it lands on the showbill and the stage itself. */
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { height: 100%; }
      body {
        margin: 0; background: var(--bg); color: var(--ink);
        overflow: hidden; touch-action: none;
      }
      /* The stage fills the window. Everything else floats over it. */
      /* touch-action on the canvas itself as well as on the body: the pinch is
         ours, and a browser that decides to page-zoom instead takes both
         fingers with it. */
      #stage {
        position: fixed; inset: 0; display: block; width: 100%; height: 100%;
        touch-action: none;
      }
      #overlay {
        position: fixed; inset: 0; pointer-events: none;
        display: flex; align-items: center; justify-content: center;
      }
      #overlay > * { pointer-events: auto; }
      #boot {
        font-size: .85rem; color: var(--dim); letter-spacing: .04em;
        text-align: center; line-height: 1.8;
      }
      #boot b { color: var(--hot); font-weight: 500; }
      #fallback { max-width: 34rem; padding: 2rem; line-height: 1.7; }
      #fallback a { color: var(--hot); }
      .corner {
        /* Above the billhouse (z-index 40): opening mode uses a transparent
           scrim, so the link stays visible but would otherwise lose clicks to
           “click anywhere to begin”. */
        position: fixed; top: .9rem; left: 1rem; z-index: 50;
        font-size: .74rem; color: var(--dim); letter-spacing: .06em;
      }
      .corner a { color: var(--dim); text-decoration: none; }
      .corner a:hover { color: var(--hot); }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="overlay">
      <div id="boot">Setting the stage…</div>
    </div>
    <div class="corner"><a href="/">← radio</a></div>
    <script type="module" src="/src/web/concert/main.ts"></script>
  </body>
</html>
