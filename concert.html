<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Concert — music generator</title>
    <style>
      :root {
        --bg: #0b0908;
        --ink: #efe6dc;
        --dim: #a2938a;
        --hot: #e0a24a;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0; background: var(--bg); color: var(--ink);
        overflow: hidden; touch-action: none;
      }
      /* The stage fills the window. Everything else floats over it. */
      #stage { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
      #overlay {
        position: fixed; inset: 0; pointer-events: none;
        display: flex; align-items: center; justify-content: center;
      }
      #overlay > * { pointer-events: auto; }
      #boot {
        font-size: .85rem; color: var(--dim); letter-spacing: .04em;
        text-align: center; line-height: 1.8;
      }
      #boot b { color: var(--hot); font-weight: 500; }
      #fallback { max-width: 34rem; padding: 2rem; line-height: 1.7; }
      #fallback a { color: var(--hot); }
      .corner {
        position: fixed; top: .9rem; left: 1rem; font-size: .74rem;
        color: var(--dim); letter-spacing: .06em;
      }
      .corner a { color: var(--dim); text-decoration: none; }
      .corner a:hover { color: var(--hot); }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="overlay">
      <div id="boot">Setting the stage…</div>
    </div>
    <div class="corner"><a href="/">← radio</a> · <a href="/voice.html">voice lab</a></div>
    <script type="module" src="/src/web/concert/main.ts"></script>
  </body>
</html>
