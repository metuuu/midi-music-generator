<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Model bench — the concert stage, part by part</title>
    <meta
      name="description"
      content="A turntable for everything the concert stage is built from — each instrument and player on its own, with its contact points shown."
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#15171a" />
    <link rel="canonical" href="https://midi.poppodi.click/models" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Music Generator" />
    <meta property="og:title" content="Model bench — the concert stage, part by part" />
    <meta
      property="og:description"
      content="A turntable for everything the concert stage is built from — each instrument and player on its own, with its contact points shown."
    />
    <meta property="og:url" content="https://midi.poppodi.click/models" />
    <meta property="og:image" content="https://midi.poppodi.click/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Music Generator — rule-based iskelmä, jazz and ambient" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      :root {
        --bg: #15171a; --ink: #e8e4de; --dim: #8d8880; --hot: #e0a24a;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      /* No tap flash: Android's Chrome paints a blue rectangle over whatever a
         finger lands on, and it lands on the controls and the canvas. */
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { height: 100%; }
      body { margin: 0; background: var(--bg); color: var(--ink); overflow: hidden; }
      #bench { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
      #ui {
        position: fixed; top: 0; left: 0; right: 0; padding: .7rem 1rem;
        display: flex; gap: .6rem; align-items: center; flex-wrap: wrap;
        background: linear-gradient(#15171ae0, #15171a00); font-size: .82rem;
      }
      select, button {
        background: #23262b; color: var(--ink); border: 1px solid #3a3e45;
        border-radius: 6px; padding: .35rem .6rem; font: inherit; cursor: pointer;
      }
      button:hover, select:hover { border-color: var(--hot); }
      button.on { border-color: var(--hot); color: var(--hot); }
      label { color: var(--dim); display: flex; gap: .35rem; align-items: center; }
      input[type="range"] { width: 7rem; cursor: grab; accent-color: var(--hot); }
      /* The tuner. Right-hand column, because the turntable is the left two thirds. */
      #tuner {
        position: fixed; top: 3.2rem; right: .8rem; bottom: .8rem; width: 19rem;
        display: flex; flex-direction: column; gap: .5rem; padding: .7rem;
        background: #1b1e22e8; border: 1px solid #3a3e45; border-radius: 8px;
        font-size: .76rem; overflow: hidden;
      }
      #tuner[hidden] { display: none; }
      #tunerHead { color: var(--dim); line-height: 1.5; }
      #tunerHead b { color: var(--ink); font-weight: 500; }
      #tunerHead .edited { color: var(--hot); }
      #tunerRows { overflow-y: auto; flex: 1; }
      #tunerRows h4 {
        margin: .7rem 0 .3rem; font-size: .72rem; font-weight: 500; color: var(--hot);
        text-transform: lowercase; letter-spacing: .04em;
      }
      #tunerRows h4:first-child { margin-top: 0; }
      #tunerRows .row {
        display: grid; grid-template-columns: 3.4rem 1fr 3.2rem; gap: .4rem;
        align-items: center; color: var(--dim); margin: .12rem 0;
      }
      #tunerRows .row input { width: 100%; }
      #tunerRows .row b { color: var(--ink); font-weight: 400; text-align: right; }
      #tunerRows .row.moved b { color: var(--hot); }
      #tunerRows .note { color: var(--dim); line-height: 1.5; }
      #tuner .buttons { display: flex; gap: .4rem; flex-wrap: wrap; align-items: center; }
      #tuner .buttons button { padding: .28rem .5rem; font-size: .74rem; }
      #tuner .buttons button.primary { border-color: var(--hot); color: var(--hot); }
      #tuner .buttons button:disabled { opacity: .35; cursor: default; }
      #tuner .buttons button:disabled:hover { border-color: #3a3e45; }
      #tunerHint { color: var(--dim); font-size: .72rem; line-height: 1.4; }
      #tunerOut {
        margin: 0; max-height: 11rem; overflow: auto; white-space: pre;
        background: #101215; border: 1px solid #3a3e45; border-radius: 6px;
        padding: .5rem; font-size: .7rem; color: var(--ink); user-select: all;
      }
      #tunerOut[hidden] { display: none; }
      #facts {
        position: fixed; left: 1rem; bottom: 1rem; font-size: .76rem;
        color: var(--dim); line-height: 1.7; white-space: pre; pointer-events: none;
      }
      #facts b { color: var(--ink); font-weight: 500; }
      .warn { color: #e2705a; }
    </style>
  </head>
  <body>
    <canvas id="bench"></canvas>
    <div id="ui">
      <select id="pick"></select>
      <button id="prev">◂</button>
      <button id="next">▸</button>
      <button id="idle">idle</button>
      <button id="play">playing</button>
      <label>stand down
        <input type="range" id="stood" min="0" max="1" step="0.01" value="1" />
        <b id="stoodv">1.00</b>
      </label>
      <label><input type="checkbox" id="player" checked /> performer</label>
      <label><input type="checkbox" id="contacts" /> contacts</label>
      <label><input type="checkbox" id="spin" /> turntable</label>
      <button id="all">grid of everything</button>
      <button id="tune">tune idle</button>
    </div>
    <div id="facts"></div>
    <div id="tuner" hidden>
      <div id="tunerHead"></div>
      <div class="buttons" id="tunerPick"></div>
      <div class="buttons">
        <button id="gizmoMove">move</button>
        <button id="gizmoTurn">turn</button>
      </div>
      <div id="tunerHint"></div>
      <div id="tunerRows"></div>
      <div class="buttons">
        <button id="tunerSave" class="primary">save to file</button>
        <button id="tunerCopy">copy</button>
        <button id="tunerReset">reset this</button>
        <button id="tunerClear">reset all</button>
      </div>
      <pre id="tunerOut" hidden></pre>
    </div>
    <script type="module" src="/src/web/concert/gallery.ts"></script>
  </body>
</html>
