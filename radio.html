<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Radio</title>
    <meta name="description" content="Twelve stations of generated music, written in the browser as it plays." />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0d0b0a" />
    <link rel="canonical" href="https://midi.poppodi.click/radio" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Radio" />
    <meta property="og:title" content="Radio" />
    <meta property="og:description" content="Twelve stations of generated music, written in the browser as it plays." />
    <meta property="og:url" content="https://midi.poppodi.click/radio" />
    <meta property="og:image" content="https://midi.poppodi.click/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      :root {
        --bg: #0d0b0a;
        --ink: #f2eae1;
        --dim: #8d8079;
        --edge: #2b2421;
        --hot: #e0a24a;
        /* The record's key, as two hues. Set per record by `radio.ts`; these are
           only what the glow looks like before the first song has been written. */
        --hue: 32;
        --hue-2: 8;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      body {
        margin: 0; background: var(--bg); color: var(--ink);
        min-height: 100svh; display: flex; justify-content: center;
        padding: max(1rem, env(safe-area-inset-top)) 1.25rem max(1.5rem, env(safe-area-inset-bottom));
        overflow-x: hidden;
      }
      /* Wide, so the stations can use the width. The player is narrowed back
         inside it — a title and three buttons spread over 40rem is a header,
         not a player. */
      .deck { width: 100%; max-width: 40rem; display: flex; flex-direction: column; }
      svg { display: block; width: 1.35rem; height: 1.35rem; fill: currentColor; }

      /* ── the focus ring ───────────────────────────────────────────────────
         The browser's own is a white-and-black pair sized for a light page. On
         this one it is the brightest thing on the screen and it belongs to
         nothing else here. The accent already means "this is the control you
         are on" — hover says it in exactly this colour — so the ring says it in
         the same words, and only to the keyboard: `:focus-visible` leaves
         nothing behind after a tap or a click.

         The offset is not decoration. Every control on this page is either a
         thin ring or a filled circle, and an outline drawn on the border sits
         on top of one; three pixels out it reads as its own mark. */
      :focus-visible { outline: 2px solid var(--hot); outline-offset: 3px; }
      /* The two controls already painted in the accent cannot wear it — a hot
         ring three pixels off a hot fill is a halo rather than a mark. Ink,
         which carries against the fill and against the page both. */
      #play:focus-visible,
      .seg button[aria-pressed="true"]:focus-visible { outline-color: var(--ink); }
      /* The station cards sit .4rem apart, and at the full offset two
         neighbours' rings all but meet. */
      .grid button:focus-visible { outline-offset: 2px; }
      /* What hover does, for the same reason: the ring says where you are, and
         a glyph at .3 opacity is too faint to say what you are on. */
      #open-settings:focus-visible, #volume-btn:focus-visible { opacity: .55; }
      /* The volume slider is a bar inside a pill barely bigger than it, so a
         ring offset from the bar lands on the pill's own edge. The pill wears
         it instead. */
      .vol-pop input:focus-visible { outline: none; }
      .vol-pop:has(input:focus-visible) { outline: 2px solid var(--hot); outline-offset: 2px; }

      /* ── the player ───────────────────────────────────────────────────────
         Takes rather over half the screen and keeps that height whatever else
         happens. It used to give some back when the stations opened, which
         moved the title and the buttons every time — the stations now have
         their space reserved for them instead, and nothing on this page moves
         once the first record has landed. */
      /* `flex-grow: 1` rather than `0 0 auto`: the deck stretches to the full
         viewport, but the player used to sit at exactly its `min-height` and
         leave the slack — 103 px on a 812 px screen — as dead air below the
         last row. Growing into it puts the player's centre where the eye
         expects it and leaves the page filling the height it was given. */
      /* `padding-bottom` is the counterweight to the title box's bottom
         alignment. A one-line title leaves its spare line above itself, which
         drops the visible group half a line down the screen; padding at the
         foot shortens the box the group is centred in and lifts it back by half
         of itself. Tuned by measurement rather than arithmetic — the body's own
         padding is not symmetrical, so half the title's 18 px left the group
         5 px low; this is the figure that puts its centre on the viewport's. */
      .player {
        flex: 1 1 auto; min-height: 45svh; width: 100%; max-width: 24rem; margin: 0 auto;
        padding-bottom: 1.78rem;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        text-align: center;
      }
      /* Two lines' worth, always, whether the title needs them or not.
         `-webkit-line-clamp` caps a long title at two lines, but a *short* one
         is one line — so the block under it moved every time a one-line title
         followed a two-line one, and the controls moved with it. Their position
         is the thing a thumb learns. */
      /* Bottom-aligned, so a one-line title sits the same distance above the
         genre line as the second line of a two-line one does. Centred, the gap
         under a short title grew by half the spare line and the block looked
         like it had come loose. The spare line now falls above the title, and
         `.player`'s bottom padding lifts the whole group back to the middle of
         the screen — see there. */
      .title-box {
        display: flex; align-items: flex-end; justify-content: center;
        width: 100%; min-height: 4.5rem;
      }
      .title {
        font-size: 1.95rem; font-weight: 600; line-height: 1.15; margin: 0;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      }
      /* Two lines' worth for the same reason the title has them. Measured over
         every genre·style pair the stations can produce, one wraps —
         "Finnish folk · Karjalanlaulu (Karelian song, amplified)" is 34 px
         against the usual 17 — and in a centred player that 17 px lifted the
         whole thing when the record landed.

         The measurement does not need redoing when a station is added, and it
         did not when the ninth arrived. `borderfm` lists all nineteen genres
         with no `styles` filter on any of them, and `recordOptions` falls back
         to `Object.keys(genre.styles)` — so the set being measured over is
         already every pair in the catalogue, and no new station can widen it. */
      .sub-box {
        display: flex; align-items: center; justify-content: center;
        width: 100%; min-height: 2.15rem; margin-top: .4rem;
      }
      .sub { color: var(--dim); font-size: .9rem; }
      /* The production era, which is where the year is. Dimmer than the genre
         line because it is the third thing you would want to know, not the
         second. Never wraps — no era label in the catalogue is long enough at
         this size, and an ellipsis is cheaper insurance than another reserved
         line. */
      .era {
        color: var(--dim); font-size: .76rem; opacity: .72; max-width: 100%;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }

      /* ── while the first record is being written ──────────────────────────
         Placeholders the size of the text that replaces them. The class is in
         the markup, so the first paint is already the placeholder — set from
         script it would flash the empty layout first, which is the thing it
         exists to prevent.

         Heights in `em`, so each one is exactly the line box of the text it
         stands in for. Stated in `rem` they were 4–5 px short apiece and the
         controls jumped on arrival, which is the whole fault this addresses.
         Widths are the measured widths of real titles rather than round
         numbers. The bar is thinner than its line box: `box-sizing` is
         `border-box` globally, so the padding eats into the height and
         `background-clip` keeps the paint off it. */
      body.booting .title, body.booting .sub, body.booting .era {
        color: transparent; border-radius: 3px; background: #1c1815;
        background-clip: content-box; animation: sk 2.4s ease-in-out infinite;
      }
      /* The `height` is the line box and matches the real text to the pixel; the
         `padding` is what decides how much of it gets painted. Set too generously
         at first, which left a 21 px bar standing in for 31 px type — the box was
         right and the mark inside it was visibly light. */
      /* Widths are the median of the real thing, measured across every
         genre·style and era label the stations can produce: subtitles run
         31–46% of the player and eras 25–33%. Guessed at, they were 64% and
         38% — both visibly wider than anything that ever replaced them. */
      body.booting .title { width: 72%; height: 1.15em; padding: .06em 0; }
      body.booting .sub { width: 33%; height: 1.2em; padding: .24em 0; }
      body.booting .era { width: 25%; height: 1.2em; padding: .26em 0; }
      @keyframes sk { 0%, 100% { opacity: .45; } 50% { opacity: .9; } }
      @media (prefers-reduced-motion: reduce) {
        body.booting .title, body.booting .sub, body.booting .era { animation: none; opacity: .6; }
      }

      /* ── the glow ─────────────────────────────────────────────────────────
         Not a progress bar and not a seek bar. It fills the width whatever is
         playing, and carries the record's key as colour — so it says "something
         is on, and it is this colour" and nothing about how far through it is.
         There is nothing to seek to and no position worth reading, so it does
         not imply one.

         Nothing here is driven from JavaScript. The colour is two custom
         properties set once per record; the breathing is one composited opacity
         animation. This page is meant to be left on for an hour, and a
         `requestAnimationFrame` running for that hour to move five pixels is a
         battery cost with nothing to show for it. */
      .glow {
        position: relative; width: 100%; height: 5px; border-radius: 3px; margin: 2.25rem 0 0;
        background: linear-gradient(90deg, hsl(var(--hue) 78% 52%), hsl(var(--hue-2) 76% 56%));
        box-shadow: 0 0 10px hsl(var(--hue) 85% 55% / .5), 0 0 26px hsl(var(--hue-2) 85% 55% / .28);
        transition: filter 1.2s ease, box-shadow 1.2s ease, opacity 1.2s ease;
      }
      /* The breathing is a second shadow fading in and out over the first,
         rather than the first one animating: `box-shadow` repaints and `opacity`
         composites, and only one of those is free to run for an hour. */
      .glow::after {
        content: ""; position: absolute; inset: 0; border-radius: inherit; opacity: 0;
        box-shadow: 0 0 16px hsl(var(--hue) 90% 62% / .7), 0 0 40px hsl(var(--hue-2) 90% 62% / .45);
      }
      body.playing .glow::after { animation: breathe 6s ease-in-out infinite; }
      @keyframes breathe { 0%, 100% { opacity: .12; } 50% { opacity: .85; } }
      /* Stopped: the colour drains out over a second rather than blinking off. */
      body:not(.playing) .glow {
        filter: grayscale(1) brightness(.8); box-shadow: none; opacity: .45;
      }
      @media (prefers-reduced-motion: reduce) {
        body.playing .glow::after { animation: none; opacity: .45; }
      }

      /* ── controls ─────────────────────────────────────────────────────────
         Four, in one row, and the sizes are the hierarchy: the cog is a bare
         dim glyph, the two round ones are secondary, the accent one is what the
         page is for. */
      /*
        Three columns, and the middle one is the play button.

        A flex row put two controls on the left of it and one on the right, so
        the button the page is about sat a good 30 px right of centre and the
        whole player looked misaligned. Equal `1fr` cells either side of an
        `auto` middle put it dead centre regardless of what flanks it, and the
        `gap` is the same 1.1 rem between every pair.
      */
      .controls {
        display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
        align-items: center; gap: 1.1rem; width: 100%; margin-top: 2rem;
      }
      .side { display: flex; align-items: center; gap: 1.1rem; }
      .side.left { justify-content: flex-end; }
      .side.right { justify-content: flex-start; }
      .controls button {
        display: grid; place-items: center;
        border: 1px solid var(--edge); background: transparent; color: var(--ink);
        border-radius: 50%; cursor: pointer; font: inherit;
        width: 3rem; height: 3rem;
        transition: color .18s ease, border-color .18s ease;
      }
      .controls button:hover:not(:disabled) { border-color: var(--hot); color: var(--hot); }
      .controls button:disabled { opacity: .35; cursor: not-allowed; }
      /*
        No ring and a dimmer glyph: it is the one control here that is not about
        the music.

        Sized to the glyph rather than to a 3 rem circle like the others. With a
        full-size box its transparent ring added 0.65 rem of dead space on each
        side, so the space between it and the stations button read as nearly
        twice every other gap. The press target is put back by a `::before` that
        reaches outside the box without taking part in the layout.
      */
      #open-settings {
        position: relative; width: 1.4rem; height: 1.4rem; padding: 0;
        border: 0; color: var(--dim); opacity: .3;
      }
      #open-settings::before { content: ""; position: absolute; inset: -.7rem; }
      #open-settings:hover { opacity: .55; }
      /* Smaller than its button, and smaller than it looks it should be. A gear
         fills its own box corner to corner where a speaker is a wedge with air
         around it: at a matched 1.4rem the cog painted 19.4 px of ink against
         the speaker's 13.5, and read as the larger control. */
      #open-settings svg { width: 1.1rem; height: 1.1rem; fill: currentColor; }
      #stations-toggle svg { fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; }

      /* Volume mirrors the cog at the other end of the row: same size, same
         dimness, same lack of a ring, so the two secondary controls bracket the
         three that are about the music. */
      /* Above the stations panel, which hangs from the same band of the page and
         would otherwise paint over this by source order alone. Safe to open a
         stacking context here — nothing inside needs to escape it. */
      .vol { position: relative; display: flex; z-index: 10; }
      #volume-btn {
        position: relative; width: 1.4rem; height: 1.4rem; padding: 0;
        border: 0; color: var(--dim); opacity: .3;
      }
      #volume-btn::before { content: ""; position: absolute; inset: -.7rem; }
      #volume-btn:hover, .vol.open #volume-btn { opacity: .55; }
      #volume-btn svg { width: 1.4rem; height: 1.4rem; fill: currentColor; }
      #volume-btn .wave, #volume-btn .wave2 {
        fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round;
      }
      /* The arcs are the level: none at silence, one turned down, both up. */
      #volume-btn[data-level="0"] .wave, #volume-btn[data-level="0"] .wave2,
      #volume-btn[data-level="1"] .wave2 { display: none; }

      /* Out to the right of the button and centred on it, floating rather than
         opening a space for itself — the same rule the stations follow. A pill
         barely taller than the slider inside it. */
      .vol-pop {
        position: absolute; left: 100%; top: 50%;
        transform: translateX(-.25rem) translateY(-50%);
        /*
          The vertical padding is not free to be whatever looks tidy: it has to
          land the bar the same distance from the pill's edge as its ends are.
          Sideways that distance is the padding *plus* the 6 px of thumb
          overhang; up and down it is the padding plus half the difference
          between the input's box and the 4 px bar. Balancing the two is what
          fixes the ring of space around the line looking thinner top and bottom
          than it does at the ends.
        */
        margin-left: .45rem; padding: .31rem .26rem;
        background: #060505; border: 1px solid var(--edge); border-radius: 999px;
        opacity: 0; visibility: hidden;
        transition: opacity .16s ease, transform .16s ease, visibility 0s linear .16s;
      }
      .vol.open .vol-pop {
        opacity: 1; visibility: visible; transform: translateX(0) translateY(-50%);
        transition: opacity .16s ease, transform .16s ease, visibility 0s;
      }
      /*
        Upright, because a volume that stands up is the one gesture everybody
        already knows and it keeps the popover a narrow column over a small
        button rather than a bar reaching across the transport.

        `direction: rtl` is what puts the minimum at the bottom; without it the
        track runs the other way and the fader reads upside down. The fill is
        the same `--fill` the other sliders use, pointed `to top`.
      */
      /* Only as tall as the thumb needs — the input's own box is mostly air
         above and below a 4 px track, and it is that, rather than the padding,
         that decides how thick the pill looks. The track itself comes from the
         shared `input[type="range"]` rules; only the sizes differ here. */
      /*
        The bar is a box on the pill, inset by half a thumb at each end, and
        both the input and its track pseudo-element are left transparent.

        A track drawn the usual way spans the input edge to edge and the thumb
        travels *inside* it — so at either extreme the thumb's centre stops half
        a thumb short and the last pixels of bar can never be reached. Setting
        the bar 6 px in on each side lines its ends up with where the thumb's
        centre actually gets to; the thumb still travels the full width, which
        is what makes the two agree.

        A real box rather than a sized background gradient, which is what it was
        first, because a background cannot take a border radius and the ends
        came out square. `--fill` is set on `.vol` so both this and the input
        inherit the same number.
      */
      .vol-pop::before {
        content: ""; position: absolute; pointer-events: none;
        left: calc(.26rem + 6px); right: calc(.26rem + 6px);
        top: 50%; height: 4px; margin-top: -2px; border-radius: 2px;
        background: linear-gradient(to right, var(--hot) var(--fill, 100%), #241e1b var(--fill, 100%));
      }
      /*
        `position: relative` is what puts the thumb over the bar rather than
        under it. The bar is absolutely positioned, so it paints in the
        positioned layer; the input, left static, painted below it and the line
        ran across the ball. Positioning the input too puts the pair in the same
        layer, where document order decides — and the input comes second.
      */
      .vol-pop input[type="range"] {
        position: relative;
        width: 5rem; height: .9rem; margin: 0; display: block; background: none;
      }
      .vol-pop input[type="range"]::-webkit-slider-runnable-track { background: none; }
      .vol-pop input[type="range"]::-moz-range-track { background: none; }
      /* Smaller than the settings sliders carry, and re-centred on the track:
         the shared rule offsets a 14 px thumb, this one is 12. */
      .vol-pop input[type="range"]::-webkit-slider-thumb {
        width: 12px; height: 12px; margin-top: -4px;
      }
      .vol-pop input[type="range"]::-moz-range-thumb { width: 12px; height: 12px; }
      #stations-toggle[aria-expanded="true"] { color: var(--hot); border-color: var(--hot); }
      #play {
        width: 4rem; height: 4rem;
        background: var(--hot); border-color: var(--hot); color: #17110a;
      }
      #play:hover { color: #17110a; }
      #play svg { width: 1.6rem; height: 1.6rem; }
      /* One icon at a time, chosen by the state the button is in. The load says
         so on the button that is loading rather than in a row underneath it. */
      #play [data-when] { display: none; }
      #play[data-state="play"] [data-when="play"],
      #play[data-state="pause"] [data-when="pause"],
      #play[data-state="load"] [data-when="load"] { display: block; }
      /* An arc on a transparent ring rather than a full ring in a washed-out
         tint of the button: a translucent dark over the accent came out muddy
         green-grey, which is not a colour anything else here uses. Half the
         circle rather than a quarter, at 4 px, so it carries at 24 px. */
      #play .spin {
        width: 1.55rem; height: 1.55rem; border-radius: 50%;
        border: 4px solid transparent;
        border-top-color: #17110a; border-right-color: #17110a;
        animation: spin 1.1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(1turn); } }
      @media (prefers-reduced-motion: reduce) { #play .spin { animation-duration: 3s; } }

      /* ── the stations ─────────────────────────────────────────────────────
         Out of the flow entirely, so they neither push anything down when they
         open nor reserve a band of empty page when they are shut. Reserving the
         space was the first attempt and it cost a screen's worth of dead air;
         taking the space cost a jump. A floating panel owes the layout nothing
         either way.

         The anchor is a zero-height box directly under the controls, and it is
         *inside* the player for a reason: the player is `flex-grow`, so it
         stretches to the bottom of the deck, and an anchor placed after it put
         the panel's top at 830 px of an 840 px screen — hanging off the bottom
         edge. Under the controls it tracks the buttons instead, which is where
         the panel is being asked for from. */
      /* No `z-index` here, deliberately. `position: relative` on its own leaves
         `z-index: auto`, which does *not* open a stacking context; giving it one
         did, and that trapped the phone sheet's `z-index: 40` inside a context
         worth 5 — so the sheet painted underneath the scrim's 30 and came up
         dimmed. The panel still sits above its in-flow siblings without it. */
      .stations-anchor { position: relative; height: 0; width: 100%; }
      /* No panel chrome on the desktop side: no card, no border, no shadow.
         It is the section it always was, sitting under the player exactly where
         it used to — the only difference is that it no longer takes part in the
         layout. A bordered box floating over the page read as a dialog, which
         is not what this is. */
      /* Four columns, so twelve stations are 4 × 3. `.grid` auto-fits at
         `minmax(8.5rem, 1fr)` with a `.4rem` gap, so anything from 35.2rem
         (four cards at their minimum) up to 44rem holds exactly four.

         37rem inside that range, and both ends of the range are wrong for the
         same reason — a label that overflows by less than `fitStationLabels`'s
         12 px threshold clips without sliding, which is the worst of both. The
         widths were swept rather than reasoned about:

           35.2rem  card 136  "Pop · R&B · Rock · Funk" clips 7 px, Cadenza 6
           36rem    card 139  the same two, 4 px and 3
           37rem    card 143  nothing clips  ← this one
           38rem    card 147  nothing clips
           40rem    card 155  "Ambient · Synth · Classical" clips 4 px
           42rem    card 163  Overdrive and Late Shift clip 10 px each

         Note 40rem, which is what this panel was before the dial grew: widening
         is not monotonically safer, because every card width puts some label
         just barely over. 37rem is the narrowest clean one, and it keeps the
         card at the 143 px it already had.

         Fitting the six-genre labels outright would need a 244 px card and a
         46rem panel. Those stay on the marquee, which is what it is for.

         Three rows here; the phone sheet below is its own media query and is
         unaffected — still two columns and six rows, and it does not scroll to
         hold them (measured at 375 × 812 it comes to 392 px against the 72svh
         it is allowed). The `overflow-y: auto` there stays as insurance. */
      .stations-wrap {
        position: absolute; top: 1.25rem; left: 50%;
        width: 37rem; max-width: calc(100vw - 2.5rem);
        transform: translateX(-50%) translateY(-.4rem);
        opacity: 0; visibility: hidden;
        transition: opacity .25s ease, transform .25s ease, visibility 0s linear .25s;
      }
      body.stations-open .stations-wrap {
        opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0);
        transition: opacity .25s ease, transform .25s ease, visibility 0s;
      }

      /* The scrim exists only for the sheet below. */
      .scrim { display: none; }

      /*
        On a phone, a sheet.

        A panel that floats under the player is fine where there is room under
        the player. On a small screen there is not, and the fight is not worth
        having: the same markup docks to the bottom edge, takes the full width,
        and gets a scrim — which is a dialog in everything but the tag, and
        needs no second copy of the station list to be one.
      */
      @media (hover: none), (max-width: 34rem) {
        .stations-wrap {
          position: fixed; inset: auto 0 0 0; top: auto; width: 100%; max-width: none;
          transform: translateY(100%); z-index: 40;
          background: #12100e; border-top: 1px solid var(--edge);
          border-radius: 16px 16px 0 0; max-height: 72svh; overflow-y: auto;
          padding: 1.1rem 1.25rem calc(1.4rem + env(safe-area-inset-bottom));
          transition: transform .28s cubic-bezier(.32, .72, 0, 1), visibility 0s linear .28s;
          opacity: 1;
        }
        body.stations-open .stations-wrap {
          transform: translateY(0);
          transition: transform .28s cubic-bezier(.32, .72, 0, 1), visibility 0s;
        }
        .scrim {
          display: block; position: fixed; inset: 0; z-index: 30; background: #000b;
          opacity: 0; visibility: hidden;
          transition: opacity .28s ease, visibility 0s linear .28s;
        }
        body.stations-open .scrim {
          opacity: 1; visibility: visible; transition: opacity .28s ease, visibility 0s;
        }
        /* The button sits about 30 px from the right edge of a phone screen and
           the pill is 90 px wide, so out to the right it would run off. Under
           the button instead, where it clears the edge by 16 px. */
        .vol-pop {
          left: 50%; top: 100%;
          transform: translateX(-50%) translateY(-.25rem);
          margin: .45rem 0 0;
        }
        .vol.open .vol-pop { transform: translateX(-50%) translateY(0); }

        /* A grip, so the sheet reads as one. */
        .stations-wrap::before {
          content: ""; display: block; width: 2.25rem; height: 4px; border-radius: 2px;
          background: var(--edge); margin: -.35rem auto .85rem;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .stations-wrap, .scrim { transition-duration: 0s; }
      }

      h2 {
        font-size: .62rem; text-transform: uppercase; letter-spacing: .13em;
        color: var(--dim); font-weight: 500; margin: 0 0 .6rem; opacity: .7;
      }
      /* Four across where there is room for four, two on a phone — the eight
         fit the width they are given rather than a fixed pair of columns. */
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(8.5rem, 1fr)); gap: .4rem; }
      .grid button {
        text-align: left; padding: .55rem .65rem; border-radius: 9px;
        border: 1px solid transparent; background: #141110; color: var(--dim);
        font: inherit; cursor: pointer; overflow: hidden;
      }
      .grid button:hover { color: var(--ink); }
      /* The current station is named in the accent and nothing else changes —
         a filled box for the one you are already listening to would be the
         loudest thing under a player it is not part of. */
      .grid button[aria-current="true"] { color: var(--hot); border-color: var(--hot); }
      .grid b { display: block; font-size: .82rem; font-weight: 600; white-space: nowrap;
                overflow: hidden; text-overflow: ellipsis; }
      /* What the station contains, in genre names, derived from the table
         rather than written about it — see `sourceLabel`.

         One line, always. A label too wide for its card slides across and back
         instead of wrapping, which keeps every card the same height whatever is
         written on it. `radio.ts` measures the overflow and only marks the ones
         that actually need it. */
      .grid span {
        display: block; margin-top: .1rem; font-size: .67rem; line-height: 1.35;
        color: var(--dim); opacity: .75;
        white-space: nowrap; overflow: hidden;
      }
      .grid span > i { display: inline-block; font-style: normal; }
      .grid span.scroll > i {
        animation: label-slide var(--dur, 9s) ease-in-out infinite alternate;
      }
      /* Long holds at both ends, so it reads as a line that occasionally shows
         you its tail rather than a ticker. */
      @keyframes label-slide {
        0%, 18% { transform: translateX(0); }
        82%, 100% { transform: translateX(var(--shift, 0)); }
      }
      @media (prefers-reduced-motion: reduce) {
        .grid span.scroll > i { animation: none; }
      }

      /* Hidden until something actually fails. A line that is always there,
         saying nothing, teaches people not to read it. */
      .oops { color: #e2705a; font-size: .82rem; margin-top: 1.25rem; text-align: center; }
      .oops[hidden] { display: none; }

      /* ── ?debug ───────────────────────────────────────────────────────────
         Off unless the address bar asks for it. This is the seam back to the
         bench: the same record, opened in the page that has every control. */
      .debug[hidden] { display: none; }
      .debug {
        margin-top: 1.5rem; padding-top: .9rem; border-top: 1px solid var(--edge);
        display: flex; align-items: center; gap: .7rem; flex-wrap: wrap;
        font-size: .72rem; color: var(--dim);
      }
      .debug a, .debug button {
        color: var(--dim); background: none; font: inherit;
        border: 1px solid var(--edge); border-radius: 7px; padding: .25rem .55rem; cursor: pointer;
        text-decoration: none;
      }
      .debug a:hover, .debug button:hover { color: var(--hot); border-color: var(--hot); }
      .debug code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: .7rem; opacity: .7;
      }

      /* ── settings ─────────────────────────────────────────────────────── */
      dialog {
        border: 1px solid var(--edge); border-radius: 18px; background: #12100e; color: var(--ink);
        width: min(23rem, calc(100vw - 2.5rem)); padding: 1.5rem 1.5rem 1.25rem;
        box-shadow: 0 24px 60px #000b;
      }
      dialog::backdrop { background: #000b; backdrop-filter: blur(2px); }
      .dlg-title {
        margin: 0 0 1.4rem; font-size: 1.05rem; font-weight: 600; letter-spacing: .01em;
      }
      dialog section + section { margin-top: 1.6rem; }
      dialog h2 { margin: 0 0 .6rem; opacity: .7; }

      /* One track with the choice sitting inside it, rather than three buttons
         with three borders — a row of equal outlined boxes reads as three
         separate controls instead of one setting with three positions. */
      .seg {
        display: flex; gap: .25rem; padding: .25rem;
        background: #1a1613; border: 1px solid var(--edge); border-radius: 11px;
      }
      .seg button {
        flex: 1; padding: .5rem .3rem; border-radius: 8px; font: inherit; font-size: .8rem;
        border: 0; background: transparent; color: var(--dim); cursor: pointer;
        transition: background .18s ease, color .18s ease;
      }
      .seg button:hover { color: var(--ink); }
      .seg button[aria-pressed="true"] {
        background: var(--hot); color: #17110a; font-weight: 600;
      }

      /* What the slider is set to, said in words rather than labelled at its
         ends. "Keep it steady ⟷ Surprise me" described the control; this
         describes the music, which is the thing being chosen. */
      .reading {
        display: flex; align-items: baseline; flex-wrap: wrap; gap: .1rem .45rem;
        margin-top: .5rem; min-height: 1.4rem;
      }
      .reading b { font-size: .78rem; font-weight: 600; color: var(--hot); }
      .reading span { font-size: .74rem; color: var(--dim); }
      input[type="range"] {
        -webkit-appearance: none; appearance: none;
        width: 100%; height: 1.5rem; background: transparent; cursor: pointer;
      }
      input[type="range"]::-webkit-slider-runnable-track {
        height: 4px; border-radius: 2px;
        background: linear-gradient(to right, var(--hot) var(--fill, 50%), #241e1b var(--fill, 50%));
      }
      input[type="range"]::-moz-range-track {
        height: 4px; border-radius: 2px;
        background: linear-gradient(to right, var(--hot) var(--fill, 50%), #241e1b var(--fill, 50%));
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none; appearance: none;
        width: 14px; height: 14px; margin-top: -5px; border-radius: 50%; background: var(--ink);
      }
      input[type="range"]::-moz-range-thumb {
        width: 14px; height: 14px; border: 0; border-radius: 50%; background: var(--ink);
      }
      .done {
        width: 100%; margin-top: 1.75rem; padding: .65rem; border-radius: 10px;
        border: 1px solid var(--edge); background: #1a1613; color: var(--ink);
        font: inherit; font-size: .85rem; cursor: pointer;
        transition: border-color .18s ease, color .18s ease;
      }
      .done:hover { border-color: var(--hot); color: var(--hot); }
    </style>
  </head>
  <body class="booting">
    <main class="deck">
      <section class="player">
        <div class="title-box"><h1 class="title" id="title"></h1></div>
        <div class="sub-box"><div class="sub" id="sub"></div></div>
        <div class="era" id="era"></div>

        <div class="glow" aria-hidden="true"></div>

        <div class="controls">
          <div class="side left">
            <button id="open-settings" aria-label="Settings">
              <!-- Solid, and built out of shapes rather than one hand-written
                   outline path: the hole is a mask, so it reads as a gear at
                   20 px instead of a tangle of curves. -->
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <mask id="cog-hole">
                  <rect width="24" height="24" fill="#fff" />
                  <circle cx="12" cy="12" r="3.15" fill="#000" />
                </mask>
                <g mask="url(#cog-hole)">
                  <circle cx="12" cy="12" r="7.3" />
                  <rect x="10.4" y="1.6" width="3.2" height="20.8" rx="1.5" />
                  <rect x="10.4" y="1.6" width="3.2" height="20.8" rx="1.5" transform="rotate(45 12 12)" />
                  <rect x="10.4" y="1.6" width="3.2" height="20.8" rx="1.5" transform="rotate(90 12 12)" />
                  <rect x="10.4" y="1.6" width="3.2" height="20.8" rx="1.5" transform="rotate(135 12 12)" />
                </g>
              </svg>
            </button>
            <button id="stations-toggle" aria-expanded="false" aria-controls="stations-wrap"
                    aria-label="Stations">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="2.1" fill="currentColor" stroke="none" />
                <path d="M8.4 8.4a5.1 5.1 0 0 0 0 7.2M15.6 15.6a5.1 5.1 0 0 0 0-7.2" />
                <path d="M5.6 5.6a9.1 9.1 0 0 0 0 12.8M18.4 18.4a9.1 9.1 0 0 0 0-12.8" />
              </svg>
            </button>
          </div>
          <button id="play" data-state="load" aria-label="Loading">
            <svg viewBox="0 0 24 24" data-when="play" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z" /></svg>
            <svg viewBox="0 0 24 24" data-when="pause" aria-hidden="true">
              <rect x="6.5" y="5" width="4" height="14" rx="1.4" />
              <rect x="13.5" y="5" width="4" height="14" rx="1.4" />
            </svg>
            <div class="spin" data-when="load" aria-hidden="true"></div>
          </button>
          <div class="side right">
            <button id="skip" aria-label="Next record" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6 5.5v13l9.5-6.5z" /><rect x="16.5" y="5.5" width="2.4" height="13" rx="1" />
              </svg>
            </button>
            <div class="vol" id="vol">
              <button id="volume-btn" aria-label="Volume" aria-expanded="false" data-level="2">
                <!-- The cone is drawn smaller than it wants to be. It carries
                     the same colour and opacity as the cog, but a solid wedge
                     that size out-weighed the gear's finer shape and read as
                     the brighter of the two. -->
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M10.4 6.4v11.2l-4.1-3.2H3.6V9.6h2.7z" />
                  <path class="wave" d="M13.8 9.8a3.2 3.2 0 0 1 0 4.4" />
                  <path class="wave2" d="M16.2 7.4a6.5 6.5 0 0 1 0 9.2" />
                </svg>
              </button>
              <div class="vol-pop" id="vol-pop">
                <input id="volume" type="range" min="0" max="100" step="1" value="100"
                       aria-label="Volume" />
              </div>
            </div>
          </div>
        </div>

        <div class="stations-anchor">
          <div class="stations-wrap" id="stations-wrap" role="group" aria-label="Stations">
            <div class="grid" id="stations"></div>
          </div>
        </div>
      </section>

      <div class="scrim" id="scrim"></div>

      <p class="oops" id="oops" hidden></p>

      <div class="debug" id="debug" hidden>
        <a id="debug-open" href="/" target="_blank" rel="noopener">Open in generator ↗</a>
        <button id="debug-copy" type="button">Copy link</button>
        <code id="debug-ref"></code>
      </div>
    </main>

    <dialog id="settings" aria-labelledby="dlg-title">
      <h3 class="dlg-title" id="dlg-title">Settings</h3>

      <section>
        <h2>Voice</h2>
        <div class="seg" id="voice">
          <button type="button" data-voice="instrumental">Instrumental</button>
          <button type="button" data-voice="mixed">Mixed</button>
          <button type="button" data-voice="sung">Sung</button>
        </div>
      </section>

      <!--
        Variety, shelved rather than deleted.

        Every station runs at `DEFAULT_WANDER` while this is hidden — see
        `boot`, which stops reading the stored value so a figure set before the
        control disappeared cannot go on quietly shaping the output with no way
        to see or change it. Taking the `hidden` off and restoring that one line
        brings it back.
      -->
      <section hidden>
        <h2>Variety</h2>
        <input id="wander" type="range" min="0" max="100" step="5" value="50"
               aria-label="How far the station wanders"
               aria-describedby="wander-name wander-gloss" />
        <div class="reading">
          <b id="wander-name"></b><span id="wander-gloss"></span>
        </div>
      </section>

      <button class="done" id="close-settings" type="button">Done</button>
    </dialog>

    <script type="module" src="/src/web/radio.ts"></script>
  </body>
</html>
