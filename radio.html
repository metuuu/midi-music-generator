<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Radio</title>
    <meta name="description" content="Twelve stations of generated music, written in the browser as it plays." />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0d0b0a" />
    <link rel="canonical" href="https://midi.poppodi.click/radio" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Radio" />
    <meta property="og:title" content="Radio" />
    <meta property="og:description" content="Twelve stations of generated music, written in the browser as it plays." />
    <meta property="og:url" content="https://midi.poppodi.click/radio" />
    <meta property="og:image" content="https://midi.poppodi.click/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      /* The record's key, as two hues. Set per record by `radio.ts`; the initial
         values are only what the glow looks like before the first song has been
         written.

         Registered rather than simply declared, because an unregistered custom
         property changes *discretely*: the bar and its halo both cut straight to
         the new key the instant a record landed, and no `transition` could reach
         them. Registered as numbers they interpolate, and everything derived
         from them — two gradients — is rebuilt from the interpolated figure
         every frame. That indirection is the point. Transitioning `background`
         instead would ask the browser to interpolate one gradient into another,
         which it does not reliably do; interpolating two numbers, it always
         does. */
      @property --hue { syntax: "<number>"; inherits: true; initial-value: 32; }
      @property --hue-2 { syntax: "<number>"; inherits: true; initial-value: 8; }

      :root {
        --bg: #0d0b0a;
        --ink: #f2eae1;
        --dim: #8d8079;
        --edge: #2b2421;
        --hot: #e0a24a;
        /* Declared here because this is the element the hues change on —
           `paintKey` sets them on the document root, and a transition only fires
           where the value moves. Long enough to read as a turn around the wheel
           rather than a cut; `paintKey` keeps the figures unwrapped, so the turn
           is always the shorter of the two arcs. */
        transition: --hue 1.8s ease-in-out, --hue-2 1.8s ease-in-out;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;

        /* The gutter, in one place, because three boxes have to agree on it:
           the deck's own padding, the stations panel's `max-width`, and the
           settings dialog's width. They were three copies of the same figure —
           the panel and the dialog each carrying it doubled — and a change to
           the padding silently left both hanging off the deck's edges. */
        --pad: 1.75rem;

        /* ── a press, as two curves ───────────────────────────────────────
           Down and back up are not the same movement and are not written as
           one. Down is short and flat: the press has already happened, and
           anything slower than about a tenth of a second reads as the page
           lagging behind the finger. Back up is five times as long, on a
           curve that overshoots its own end — that overshoot is the bounce.
           It is worth a quarter of a pixel at the sizes here, which is the
           right amount: the movements it rides on are two pixels at their
           largest, and a bounce you can measure on a control that small is a
           control coming loose from the row.

           Held here because four families of button share them, and a press
           that answers differently on a station card than on Play is a page
           with two personalities. Each control spends them the same way:
           `transform var(--squish, var(--bounce))`, where the default is the
           spring and `:active` swaps in the dip. One declaration therefore
           carries both the way down and the way back, and neither can drift
           from the other — the transition in force is always the one belonging
           to the state being moved *into*. */
        --bounce: .45s cubic-bezier(.34, 1.56, .64, 1);
        --dip: .09s cubic-bezier(.4, 0, .6, 1);

        /* ── the whole page, as one number ────────────────────────────────
           Every size here is in `rem` — type, buttons, gaps, the player's
           width, the stations panel's — so the root font size is the only
           lever the layout needs. Moving it continuously means the page
           shrinks as one drawing rather than as a set of drawings that snap
           between breakpoints, and the card-width sweep noted down at
           `.stations-wrap` holds all the way down: card and type shrink
           together, so a label that fits at one size fits at every size.

           `1rem` is the ceiling, and the ceiling is the page as it was
           designed. This only ever gives size back to a viewport too small to
           hold it — it never takes a screen with room to spare and inflates
           the type to fill it, which is how a player ends up looking like a
           kiosk on a large monitor. On anything from a 360px phone up, this
           is exactly the layout that was here before.

           Both shrink terms are lengths rather than a fraction of the
           reader's own font size, and that is the right way round for what
           they are: fit constraints, not preferences. A reader who has set
           their browser to 20px keeps all of it wherever the page has room —
           the cap is in `rem`, so their `1rem` is their 20px — but at 20px on
           a 375px screen the station sheet cannot hold two columns, and no
           preference makes it able to.

           4.44vw is 16px at 360px wide and proportional below it. `min()`
           against `svh` is the other half: a 812 × 375 phone held sideways
           has width to spare and no height at all, and the column comes to
           about 20.5rem all told, so 4.4svh is the largest root size that
           still leaves air under the buttons. On anything of ordinary height
           the height term is far above the cap and never applies. */
        font-size: clamp(0.75rem, min(4.44vw, 4.4svh), 1rem);
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      body {
        margin: 0; background: var(--bg); color: var(--ink);
        min-height: 100svh; display: flex; justify-content: center;
        padding: max(1rem, env(safe-area-inset-top)) var(--pad) max(1.5rem, env(safe-area-inset-bottom));
        overflow-x: hidden;
      }
      /* Wide, so the stations can use the width. The player is narrowed back
         inside it — a title and three buttons spread over 40rem is a header,
         not a player. */
      .deck { width: 100%; max-width: 40rem; display: flex; flex-direction: column; }
      svg { display: block; width: 1.35rem; height: 1.35rem; fill: currentColor; }

      /* ── the focus ring ───────────────────────────────────────────────────
         The browser's own is a white-and-black pair sized for a light page. On
         this one it is the brightest thing on the screen and it belongs to
         nothing else here. The accent already means "this is the control you
         are on" — hover says it in exactly this colour — so the ring says it in
         the same words, and only to the keyboard: `:focus-visible` leaves
         nothing behind after a tap or a click.

         The offset is not decoration. Every control on this page is either a
         thin ring or a filled circle, and an outline drawn on the border sits
         on top of one; three pixels out it reads as its own mark. */
      :focus-visible { outline: 2px solid var(--hot); outline-offset: 3px; }
      /* The segmented control's chosen tab is painted in the accent and butts up
         against its neighbours, so a hot ring on it reads as a halo on the fill
         rather than as a mark. Ink, which carries against the fill and against
         the page both. Play keeps the accent ring like everything else: it has
         three pixels of page all the way round it, and one control answering
         focus in a different colour to the rest of the row is the odder thing. */
      .seg button[aria-pressed="true"]:focus-visible { outline-color: var(--ink); }
      /* The station cards sit .4rem apart, and at the full offset two
         neighbours' rings all but meet. */
      .grid button:focus-visible { outline-offset: 2px; }
      /* What hover does, for the same reason: the ring says where you are, and
         a glyph at .3 opacity is too faint to say what you are on. */
      #open-settings:focus-visible, #volume-btn:focus-visible { opacity: .55; }
      /* The volume slider is a bar inside a pill barely bigger than it, so a
         ring offset from the bar lands on the pill's own edge. The pill wears
         it instead. */
      .vol-pop input:focus-visible { outline: none; }
      .vol-pop:has(input:focus-visible) { outline: 2px solid var(--hot); outline-offset: 2px; }

      /* ── the player ───────────────────────────────────────────────────────
         Takes rather over half the screen and keeps that height whatever else
         happens. It used to give some back when the stations opened, which
         moved the title and the buttons every time — the stations now have
         their space reserved for them instead, and nothing on this page moves
         once the first record has landed. */
      /* `flex-grow: 1` rather than `0 0 auto`: the deck stretches to the full
         viewport, but the player used to sit at exactly its `min-height` and
         leave the slack — 103 px on a 812 px screen — as dead air below the
         last row. Growing into it puts the player's centre where the eye
         expects it and leaves the page filling the height it was given. */
      /* `padding-bottom` is the counterweight to the title box's bottom
         alignment. A one-line title leaves its spare line above itself, which
         drops the visible group half a line down the screen; padding at the
         foot shortens the box the group is centred in and lifts it back by half
         of itself. Tuned by measurement rather than arithmetic — the body's own
         padding is not symmetrical, so half the title's 18 px left the group
         5 px low; this is the figure that puts its centre on the viewport's. */
      .player {
        flex: 1 1 auto; min-height: 45svh; width: 100%; max-width: 24rem; margin: 0 auto;
        padding-bottom: 1.78rem;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        text-align: center;
      }
      /* Two lines' worth, always, whether the title needs them or not.
         `-webkit-line-clamp` caps a long title at two lines, but a *short* one
         is one line — so the block under it moved every time a one-line title
         followed a two-line one, and the controls moved with it. Their position
         is the thing a thumb learns. */
      /* Bottom-aligned, so a one-line title sits the same distance above the
         genre line as the second line of a two-line one does. Centred, the gap
         under a short title grew by half the spare line and the block looked
         like it had come loose. The spare line now falls above the title, and
         `.player`'s bottom padding lifts the whole group back to the middle of
         the screen — see there. */
      .title-box {
        display: flex; align-items: flex-end; justify-content: center;
        width: 100%; min-height: 4.5rem;
      }
      .title {
        font-size: 1.95rem; font-weight: 600; line-height: 1.15; margin: 0;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      }
      /* Two lines' worth for the same reason the title has them. Measured over
         every genre·style pair the stations can produce, one wraps —
         "Finnish folk · Karjalanlaulu (Karelian song, amplified)" is 34 px
         against the usual 17 — and in a centred player that 17 px lifted the
         whole thing when the record landed.

         The measurement does not need redoing when a station is added, and it
         did not when the ninth arrived. `borderfm` lists all nineteen genres
         with no `styles` filter on any of them, and `recordOptions` falls back
         to `Object.keys(genre.styles)` — so the set being measured over is
         already every pair in the catalogue, and no new station can widen it. */
      .sub-box {
        display: flex; align-items: center; justify-content: center;
        width: 100%; min-height: 2.15rem; margin-top: .4rem;
      }
      .sub { color: var(--dim); font-size: .9rem; }
      /* The production era, which is where the year is. Dimmer than the genre
         line because it is the third thing you would want to know, not the
         second. Never wraps — no era label in the catalogue is long enough at
         this size, and an ellipsis is cheaper insurance than another reserved
         line. */
      .era {
        color: var(--dim); font-size: .76rem; opacity: .72; max-width: 100%;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }

      /* ── while the first record is being written ──────────────────────────
         Placeholders the size of the text that replaces them. The class is in
         the markup, so the first paint is already the placeholder — set from
         script it would flash the empty layout first, which is the thing it
         exists to prevent.

         Heights in `em`, so each one is exactly the line box of the text it
         stands in for. Stated in `rem` they were 4–5 px short apiece and the
         controls jumped on arrival, which is the whole fault this addresses.
         Widths are the measured widths of real titles rather than round
         numbers. The bar is thinner than its line box: `box-sizing` is
         `border-box` globally, so the padding eats into the height and
         `background-clip` keeps the paint off it. */
      body.booting .title, body.booting .sub, body.booting .era {
        color: transparent; border-radius: 3px; background: #1c1815;
        background-clip: content-box; animation: sk 2.4s ease-in-out infinite;
      }
      /* The `height` is the line box and matches the real text to the pixel; the
         `padding` is what decides how much of it gets painted. Set too generously
         at first, which left a 21 px bar standing in for 31 px type — the box was
         right and the mark inside it was visibly light. */
      /* Widths are the median of the real thing, measured across every
         genre·style and era label the stations can produce: subtitles run
         31–46% of the player and eras 25–33%. Guessed at, they were 64% and
         38% — both visibly wider than anything that ever replaced them. */
      body.booting .title { width: 72%; height: 1.15em; padding: .06em 0; }
      body.booting .sub { width: 33%; height: 1.2em; padding: .24em 0; }
      body.booting .era { width: 25%; height: 1.2em; padding: .26em 0; }
      @keyframes sk { 0%, 100% { opacity: .45; } 50% { opacity: .9; } }
      @media (prefers-reduced-motion: reduce) {
        body.booting .title, body.booting .sub, body.booting .era { animation: none; opacity: .6; }
      }

      /* ── the glow ─────────────────────────────────────────────────────────
         Not a progress bar and not a seek bar. It fills the width whatever is
         playing, and carries the record's key as colour — so it says "something
         is on, and it is this colour" and nothing about how far through it is.
         There is nothing to seek to and no position worth reading, so it does
         not imply one.

         Nothing here is driven from JavaScript. The colour is two custom
         properties set once per record; the breathing is one composited opacity
         animation. This page is meant to be left on for an hour, and a
         `requestAnimationFrame` running for that hour to move five pixels is a
         battery cost with nothing to show for it.

         Three layers, and the element itself paints none of them: `::before` is
         the wide bloom, `<i>` the tight rim, `::after` the bar. Document order
         alone puts the two halo layers behind the bar — no `z-index`, which
         matters, because the stopped state hangs a `filter` on `.glow` and a
         filter opens a stacking context that a negative `z-index` cannot climb
         out of. The extra element earns its place: one `box-shadow` could stack
         two blurs on a single box and `filter: blur()` cannot, so a tight rim
         and a wide bloom need a box each. */
      .glow {
        position: relative; width: 100%; height: 5px; margin: 2.25rem 0 0;
        transition: filter 1.2s ease, opacity 1.2s ease;
      }
      .glow::after {
        content: ""; position: absolute; inset: 0; border-radius: 3px;
        background: linear-gradient(90deg, hsl(var(--hue) 78% 52%), hsl(var(--hue-2) 76% 56%));
      }
      /* The halo is the bar again, blurred, rather than a `box-shadow`.

         A shadow takes one flat colour and spreads it evenly around the whole
         box. The two this used to carry — one per hue — therefore mixed into a
         single average everywhere, and the glow came out the same colour at both
         ends of a bar that is two. A blurred copy of the gradient is, at every
         point across the width, the colour of the bar directly above it.

         Both layers are taller than the bar on purpose. Blurring a 5 px band by
         14 px leaves under a fifth of its alpha at the peak, so the extra height
         is what buys back the strength the shadows had at the reach they had —
         matched against them layer by layer rather than guessed. */
      .glow > i, .glow::before {
        content: ""; position: absolute; border-radius: 8px;
        background: linear-gradient(90deg, hsl(var(--hue) 88% 56%), hsl(var(--hue-2) 88% 56%));
        transition: filter 1.2s ease;
      }
      /* The halo fades on the `opacity()` *filter* rather than the `opacity`
         property, and that is the whole reason the on and off are smooth.

         An animation outranks a transition on the property they share. While
         the breathing sat on `opacity` and the stopped state sat on `opacity`
         too, the two could only take turns: starting playback handed the bloom
         to the keyframes, which begin at .19 wherever the fade had got to, and
         stopping took the animation away, which drops the layer at whatever
         frame it was last drawn on. Both ends of the transport snapped, and the
         second one snapped from a different brightness every time.

         Two properties, no argument. The keyframes keep `opacity` and never let
         go of it; the transport moves a filter alongside them, and the layer's
         painted alpha is the product of the two. Both lists name the same
         functions in the same order so the interpolation is defined rather than
         merely usually right, and the blur is already forcing a layer here, so
         the filter costs nothing a blurred copy of the bar was not costing. */
      .glow > i { inset: -1px; filter: blur(5px) opacity(1); opacity: .37; }
      .glow::before { inset: -4px -3px; filter: blur(14px) opacity(1); opacity: .41; }
      /* The breathing is the bloom's opacity and nothing else: `opacity`
         composites where a `box-shadow` repaints, and only one of those is free
         to run for an hour. The rim holds still underneath it, so what swells is
         the reach of the glow rather than the brightness of the bar.

         It is declared unconditionally and paused when stopped, not switched off
         and on. A paused animation holds the exact value it froze at and resumes
         from it, so the breath is one continuous curve across a stop and a start
         with an invisible stretch in the middle — where switching it off means
         re-entering the cycle at 0% no matter where it left. It costs nothing
         while it is paused. */
      .glow::before { animation: breathe 6s ease-in-out infinite; }
      @keyframes breathe { 0%, 100% { opacity: .19; } 50% { opacity: .64; } }
      /* Stopped: the colour drains out over a second rather than blinking off,
         and the halo goes with it. */
      body:not(.playing) .glow { filter: grayscale(1) brightness(.8); opacity: .45; }
      body:not(.playing) .glow > i { filter: blur(5px) opacity(0); }
      body:not(.playing) .glow::before { filter: blur(14px) opacity(0); animation-play-state: paused; }
      @media (prefers-reduced-motion: reduce) {
        .glow::before { animation: none; opacity: .41; }
      }

      /* ── the glow, when it is a field ─────────────────────────────────────
         `web/glow-field.ts` draws the bar as a bundle of particle strands that
         can be torn apart with the cursor. The class goes on only once that has
         actually started; on a browser without WebGL2, or one that loses the
         context later, everything above is what stays on the screen.

         The two halo layers are taken off by the same filter the transport
         uses, not by `opacity`, and for the same reason: the bloom's `opacity`
         belongs to the breath, and a declaration cannot outbid an animation on
         the property it is animating. Setting it here would have left the CSS
         bloom breathing away underneath the field. */
      body.glow-live .glow > i { filter: blur(5px) opacity(0); }
      body.glow-live .glow::before { filter: blur(14px) opacity(0); }
      body.glow-live .glow::after { opacity: 0; }
      /* The canvas covers the whole viewport, and it has to: a torn particle
         travels a long way from the bar, and any box tight enough to frame the
         glow is an edge for it to be clipped against. It sits behind the page
         rather than over it — `z-index: -1` puts it under the title and the
         controls but above the body's own background, so the particles pass
         behind the type instead of washing over it.

         All of which is set inline, in `glow-field.ts`, and deliberately not
         here: a canvas is a replaced element, so its position and *size* have to
         be stated together — `inset: 0` alone leaves it at the intrinsic size of
         its drawing buffer, which puts the bar off down the page at half the
         resolution and looks like anything but a missing stylesheet rule. What
         is left here is only what the field can afford to lose. */
      .glow-field { transition: filter 1.2s ease; }
      /* The stopped state, which the CSS layers get from `.glow` and this cannot,
         because it hangs off the body rather than off the bar.

         The dimming rides in the filter for the same reason it does up in the
         halo: `opacity` is spoken for by the breath, and a property with an
         animation on it cannot also be transitioned. Filters interpolate out of
         `none` against the identity value of each function they are going to,
         so the playing state stays filterless — worth keeping for an element
         that covers the viewport and is redrawn while it plays.

         .49 rather than .45 because what lands on the screen is this times the
         frame the breath froze on, and the breath averages .92. */
      body:not(.playing) .glow-field {
        filter: grayscale(1) brightness(.8) opacity(.49);
        animation-play-state: paused;
      }
      /* The breathing stays in CSS rather than moving into the shader, and that
         is the whole reason the field is allowed to sleep: an `opacity`
         animation composites, so this costs no frame of ours, where a `time`
         uniform would cost every frame for the hour the page is left on. */
      .glow-field { animation: field-breathe 6s ease-in-out infinite; }
      @keyframes field-breathe { 0%, 100% { opacity: .84; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .glow-field { animation: none; opacity: .92; }
      }

      /* ── controls ─────────────────────────────────────────────────────────
         Four, in one row, and the sizes are the hierarchy: the cog is a bare
         dim glyph, the two round ones are secondary, the accent one is what the
         page is for. */
      /*
        Three columns, and the middle one is the play button.

        A flex row put two controls on the left of it and one on the right, so
        the button the page is about sat a good 30 px right of centre and the
        whole player looked misaligned. Equal `1fr` cells either side of an
        `auto` middle put it dead centre regardless of what flanks it, and the
        `gap` is the same 1.1 rem between every pair.
      */
      .controls {
        display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
        align-items: center; gap: 1.1rem; width: 100%; margin-top: 2rem;
      }
      .side { display: flex; align-items: center; gap: 1.1rem; }
      .side.left { justify-content: flex-end; }
      .side.right { justify-content: flex-start; }
      .controls button {
        display: grid; place-items: center;
        border: 1px solid var(--edge); background: transparent; color: var(--ink);
        border-radius: 50%; cursor: pointer; font: inherit;
        width: 3rem; height: 3rem;
        transition: color .18s ease, border-color .18s ease, opacity .3s ease,
                    transform var(--squish, var(--bounce));
      }
      /* `.aimed` rather than `:hover`, and put there by the script — see
         "A pointer that meant it". It is the same state with one condition
         added: the pointer is on the control *and was going slowly enough to
         have meant it*, so a mouse flung across the page no longer lights up
         every control it happens to cross on the way.

         It also settles what `:hover` gets wrong on a touch screen, which has
         no pointer to leave and so leaves the last thing tapped hovered until
         something else is tapped — Next, which does its work and stays where it
         is, sat there wearing the accent as though it were still pressed. The
         script only ever adds the class under `(hover: hover)`. */
      /* The growth is part of the same answer as the colour, and the figure was
         found by overshooting it in both directions. A twentieth is a 3 rem
         circle visibly becoming a different size of circle in a row where every
         other one stayed put; a fiftieth is half a pixel of edge, which is not a
         movement so much as a rumour of one. This sits between them at a pixel
         or so per edge — plainly seen, and still a control coming forward to
         meet the pointer rather than changing what it is. It rides on `.aimed`
         with everything else, so a mouse flung across the row does not make six
         controls flinch. */
      .controls button.aimed:not(:disabled) {
        border-color: var(--hot); color: var(--hot); transform: scale(1.035);
      }
      /* And the press itself, which is the thing colour cannot say: a control
         that only brightens has told you the pointer is on it, not that it took
         the click. Rather more than the hover growth, and that ordering is the
         point: hovering is the page noticing you, pressing is the page
         answering, so the press has to be the larger of the two movements. It
         is the deepest one on the page — a couple of pixels off the small
         circles and three off Play, which is as far as a control can go and
         still look like it sprang back rather than shrank. `:not(:disabled)`
         because Next spends the first record greyed out, and a dead button that
         still dips is a button that lies. */
      .controls button:active:not(:disabled) { --squish: var(--dip); transform: scale(.95); }
      .controls button:disabled { opacity: .35; cursor: not-allowed; }
      /*
        No ring and a dimmer glyph: it is the one control here that is not about
        the music.

        Sized to the glyph rather than to a 3 rem circle like the others. With a
        full-size box its transparent ring added 0.65 rem of dead space on each
        side, so the space between it and the stations button read as nearly
        twice every other gap. The press target is put back by a `::before` that
        reaches outside the box without taking part in the layout.
      */
      #open-settings {
        position: relative; width: 1.4rem; height: 1.4rem; padding: 0;
        border: 0; color: var(--dim); opacity: .3;
      }
      #open-settings::before { content: ""; position: absolute; inset: -.7rem; }
      #open-settings.aimed { opacity: .55; }
      /* Smaller than its button, and smaller than it looks it should be. A gear
         fills its own box corner to corner where a speaker is a wedge with air
         around it: at a matched 1.4rem the cog painted 19.4 px of ink against
         the speaker's 13.5, and read as the larger control. */
      #open-settings svg { width: 1.1rem; height: 1.1rem; fill: currentColor; }
      #stations-toggle svg { fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; }
      /* Next carries the same argument as Play, at its own scale: a pointed
         wedge alongside a bar rounded at 1. The `rect` keeps its own `rx` — only
         the wedge needs drawing small and stroking back out. */
      #skip path { stroke: currentColor; stroke-width: 2; stroke-linejoin: round; }

      /* Volume mirrors the cog at the other end of the row: same size, same
         dimness, same lack of a ring, so the two secondary controls bracket the
         three that are about the music. */
      /* Above the stations panel, which hangs from the same band of the page and
         would otherwise paint over this by source order alone. Safe to open a
         stacking context here — nothing inside needs to escape it. */
      .vol { position: relative; display: flex; z-index: 10; }
      #volume-btn {
        position: relative; width: 1.4rem; height: 1.4rem; padding: 0;
        border: 0; color: var(--dim); opacity: .3;
      }
      #volume-btn::before { content: ""; position: absolute; inset: -.7rem; }
      #volume-btn.aimed, .vol.open #volume-btn { opacity: .55; }
      #volume-btn svg { width: 1.4rem; height: 1.4rem; fill: currentColor; }
      #volume-btn .wave, #volume-btn .wave2 {
        fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round;
      }
      /* The arcs are the level: none at silence, one turned down, both up. */
      #volume-btn[data-level="0"] .wave, #volume-btn[data-level="0"] .wave2,
      #volume-btn[data-level="1"] .wave2 { display: none; }

      /* Out to the right of the button and centred on it, floating rather than
         opening a space for itself — the same rule the stations follow. A pill
         barely taller than the slider inside it. */
      .vol-pop {
        position: absolute; left: 100%; top: 50%;
        transform: translateX(-.25rem) translateY(-50%);
        /*
          The padding is not free to be whatever looks tidy, and the two figures
          are not the same figure: one runs across the bar, the other along it,
          and they are named that way because turning the fader upright on the
          phone swaps which is which.

          What has to come out even is the ring of space around the *thumb* at
          the ends of its travel — that ball is what the eye measures the pill
          against, and it was sitting 2 px nearer the ends than the sides.
          Across the bar the gap is the padding plus the sliver of air the
          input's own box carries around a 12 px ball; along it the thumb's
          centre stops exactly on the bar's end, so the gap is the padding and
          nothing else. The 2 px is what that sliver is worth.

          The bar underneath then sits fractionally longer than it is thick out
          from the pill's edge. That is the trade and it is the right way round
          — the ball is a solid 12 px object and the line is 4 px, so the line's
          own spacing is read at the ends, where the ball is standing.
        */
        --across: .31rem;
        --along: calc(.26rem + 2px);
        margin-left: .45rem; padding: var(--across) var(--along);
        background: #060505; border: 1px solid var(--edge); border-radius: 999px;
        opacity: 0; visibility: hidden;
        transition: opacity .16s ease, transform .16s ease, visibility 0s linear .16s;
      }
      .vol.open .vol-pop {
        opacity: 1; visibility: visible; transform: translateX(0) translateY(-50%);
        transition: opacity .16s ease, transform .16s ease, visibility 0s;
      }
      /*
        Upright, because a volume that stands up is the one gesture everybody
        already knows and it keeps the popover a narrow column over a small
        button rather than a bar reaching across the transport.

        `direction: rtl` is what puts the minimum at the bottom; without it the
        track runs the other way and the fader reads upside down. The fill is
        the same `--fill` the other sliders use, pointed `to top`.
      */
      /* Only as tall as the thumb needs — the input's own box is mostly air
         above and below a 4 px track, and it is that, rather than the padding,
         that decides how thick the pill looks. The track itself comes from the
         shared `input[type="range"]` rules; only the sizes differ here. */
      /*
        The bar is a box on the pill, inset by half a thumb at each end, and
        both the input and its track pseudo-element are left transparent.

        A track drawn the usual way spans the input edge to edge and the thumb
        travels *inside* it — so at either extreme the thumb's centre stops half
        a thumb short and the last pixels of bar can never be reached. Setting
        the bar 6 px in on each side lines its ends up with where the thumb's
        centre actually gets to; the thumb still travels the full width, which
        is what makes the two agree.

        A real box rather than a sized background gradient, which is what it was
        first, because a background cannot take a border radius and the ends
        came out square. `--fill` is set on `.vol` so both this and the input
        inherit the same number.
      */
      .vol-pop::before {
        content: ""; position: absolute; pointer-events: none;
        left: calc(var(--along) + 6px); right: calc(var(--along) + 6px);
        top: 50%; height: 4px; margin-top: -2px; border-radius: 2px;
        background: linear-gradient(to right, var(--hot) var(--fill, 100%), #241e1b var(--fill, 100%));
      }
      /*
        `position: relative` is what puts the thumb over the bar rather than
        under it. The bar is absolutely positioned, so it paints in the
        positioned layer; the input, left static, painted below it and the line
        ran across the ball. Positioning the input too puts the pair in the same
        layer, where document order decides — and the input comes second.
      */
      .vol-pop input[type="range"] {
        position: relative;
        width: 5rem; height: .9rem; margin: 0; display: block; background: none;
      }
      .vol-pop input[type="range"]::-webkit-slider-runnable-track { background: none; }
      .vol-pop input[type="range"]::-moz-range-track { background: none; }
      /* Smaller than the settings sliders carry, and re-centred on the track:
         the shared rule offsets a 14 px thumb, this one is 12. */
      .vol-pop input[type="range"]::-webkit-slider-thumb {
        width: 12px; height: 12px; margin-top: -4px;
      }
      .vol-pop input[type="range"]::-moz-range-thumb { width: 12px; height: 12px; }
      #stations-toggle[aria-expanded="true"] { color: var(--hot); border-color: var(--hot); }
      #play {
        width: 4rem; height: 4rem;
        background: var(--hot); border-color: var(--hot); color: #17110a;
      }
      #play.aimed { color: #17110a; }
      #play svg { width: 1.6rem; height: 1.6rem; }
      /* One icon at a time, chosen by the state the button is in. The load says
         so on the button that is loading rather than in a row underneath it.

         Both are drawn at once, stacked in the button's single grid cell, and
         only opacity and scale say which one is current. Switched with
         `display` — which is what this was — the triangle vanished in the same
         frame the bars appeared, and the one control the page is about answered
         a click with a cut. Nothing transitions out of `display: none`, so the
         icons had to stay on the screen to be animated off it.

         Load is the state with no glyph at all. There is no rule lighting one
         for it, so the default below simply holds: whichever icon was showing
         fades out and the disc is left bare, and the button itself carries the
         message — see the breath under this. A spinner stood here before and
         was the one thing on the page keeping its own time, turning at a rate
         nothing else moved at, on the single control the eye is already on. */
      /* The fade and the scale are meant to be read together; the scale is what
         gives the fade a direction. From half size it was an icon flying in from
         somewhere, which is a lot of event for a button that has changed its
         mind about one glyph — and from a sixth it was the fade with a nudge
         nobody would name. At .7 the triangle gives way and the bars arrive
         having leant in, which is the whole of what it has to say. */
      #play [data-when] {
        grid-area: 1 / 1; pointer-events: none;
        opacity: 0; scale: .7;
        transition: opacity .16s ease, scale var(--bounce);
      }
      #play[data-state="play"] [data-when="play"],
      #play[data-state="pause"] [data-when="pause"] { opacity: 1; scale: 1; }
      /* The triangle, blunted. Three sharp points next to a pair of bars rounded
         at 1.4 was the button contradicting itself twice a song — so the path is
         drawn 1.4 units inside the shape it wants to be and given a 2.8 stroke
         to grow back out on a round join. Same silhouette as before, same 1.4 of
         radius as the bars carry, and no arcs to hand-write. */
      #play [data-when="play"] path {
        stroke: currentColor; stroke-width: 2.8; stroke-linejoin: round;
      }
      /* ── the load, as a breath ────────────────────────────────────────────
         The bare disc, fading out and back. A spinner stood here and it was a
         small machine running: it turned at a fixed rate, it turned at that
         rate whether the wait was two seconds or twenty, and it said "working"
         in the vocabulary of a progress cursor. Nothing else on the page moves
         like that — the glow drifts, the icons swap on a spring, the label
         slides — so it was the one element keeping its own time, sitting on the
         one control the eye is already on. The breath says the same thing in
         the page's own terms, and says it about the button rather than about a
         widget parked inside it. It is also the same figure the glow breathes
         on, six seconds and eased at both ends, taken at a third of the length:
         this is a wait, and the glow is a room.

         The floor is .6, and that is the whole of the restraint here. Next
         spends the first record disabled at .35, so anything much below a half
         has the button loading and the button dead reading as one state. Two
         seconds, which is slower than breathing and deliberately: at a walking
         rate a fade stops being a breath and becomes a pulse, and a pulse is an
         alarm. Full at both ends, so it begins without a step and loops without
         a seam.

         The way out is not arranged here, and it does not arrange itself: a
         dropped animation will not reliably transition out of the value it was
         last drawn at, so leaving `load` put the disc back at full in a single
         frame. `releaseBreath` in the script pins the opacity where the breath
         had got to and lets it go a frame later; the `opacity` in the
         transition list on `.controls button` is what that lands on. */
      #play[data-state="load"] { animation: play-breathe 2s ease-in-out infinite; }
      @keyframes play-breathe { 0%, 100% { opacity: 1; } 50% { opacity: .6; } }
      /* Slowed rather than stopped, where the glow under reduced motion is
         stopped and pinned. The difference is that the glow is scenery and this
         is the only word the page says while a record is being made: a still
         button through a twenty-second wait is a page that has hung. A long
         fade is about as little motion as a thing can have and still be
         moving — which is the reading the spinner here got too. */
      @media (prefers-reduced-motion: reduce) {
        #play[data-state="load"] { animation-duration: 4.5s; }
      }

      /* ── the stations ─────────────────────────────────────────────────────
         Out of the flow entirely, so they neither push anything down when they
         open nor reserve a band of empty page when they are shut. Reserving the
         space was the first attempt and it cost a screen's worth of dead air;
         taking the space cost a jump. A floating panel owes the layout nothing
         either way.

         The anchor is a zero-height box directly under the controls, and it is
         *inside* the player for a reason: the player is `flex-grow`, so it
         stretches to the bottom of the deck, and an anchor placed after it put
         the panel's top at 830 px of an 840 px screen — hanging off the bottom
         edge. Under the controls it tracks the buttons instead, which is where
         the panel is being asked for from. */
      /* No `z-index` here, deliberately. `position: relative` on its own leaves
         `z-index: auto`, which does *not* open a stacking context; giving it one
         did, and that trapped the phone sheet's `z-index: 40` inside a context
         worth 5 — so the sheet painted underneath the scrim's 30 and came up
         dimmed. The panel still sits above its in-flow siblings without it. */
      .stations-anchor { position: relative; height: 0; width: 100%; }
      /* No panel chrome on the desktop side: no card, no border, no shadow.
         It is the section it always was, sitting under the player exactly where
         it used to — the only difference is that it no longer takes part in the
         layout. A bordered box floating over the page read as a dialog, which
         is not what this is. */
      /* Four columns, so twelve stations are 4 × 3. `.grid` auto-fits at
         `minmax(8.5rem, 1fr)` with a `.4rem` gap, so anything from 35.2rem
         (four cards at their minimum) up to 44rem holds exactly four.

         37rem inside that range, and both ends of the range are wrong for the
         same reason — a label that overflows by less than `fitStationLabels`'s
         12 px threshold clips without sliding, which is the worst of both. The
         widths were swept rather than reasoned about:

           35.2rem  card 136  "Pop · R&B · Rock · Funk" clips 7 px, Cadenza 6
           36rem    card 139  the same two, 4 px and 3
           37rem    card 143  nothing clips  ← this one
           38rem    card 147  nothing clips
           40rem    card 155  "Ambient · Synth · Classical" clips 4 px
           42rem    card 163  Overdrive and Late Shift clip 10 px each

         Note 40rem, which is what this panel was before the dial grew: widening
         is not monotonically safer, because every card width puts some label
         just barely over. 37rem is the narrowest clean one, and it keeps the
         card at the 143 px it already had.

         Fitting the six-genre labels outright would need a 244 px card and a
         46rem panel. Those stay on the marquee, which is what it is for.

         The px figures above are at a 16px root, which is the largest the
         root now gets — see `:root`. Below it the sweep is unaffected,
         because the type shrinks with the card: a 37rem panel is 4 × 143 px
         of card at 16px and 4 × 125 px at 14px, and the labels on those cards
         are an eighth smaller too, so what fits is the same list either way.
         `fitStationLabels` re-measures on resize regardless, which is what
         catches the rest.

         Three rows here; the phone sheet below is its own media query and is
         unaffected — still two columns and six rows, and it does not scroll to
         hold them (measured at 375 × 812 it comes to 392 px against the 72svh
         it is allowed). The `overflow-y: auto` there stays as insurance. */
      .stations-wrap {
        position: absolute; top: 1.25rem; left: 50%;
        width: 37rem; max-width: calc(100vw - 2 * var(--pad));
        transform: translateX(-50%) translateY(-.4rem);
        opacity: 0; visibility: hidden;
        transition: opacity .25s ease, transform .25s ease, visibility 0s linear .25s;
      }
      body.stations-open .stations-wrap {
        opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0);
        transition: opacity .25s ease, transform .25s ease, visibility 0s;
      }

      /* The scrim exists only for the sheet below. */
      .scrim { display: none; }
      /* …and so does the grip. Above the break neither panel is a sheet — the
         stations float under the player and the settings are a centred card —
         and a bar that says "pull me down" over something that does not move is
         a lie. `display: none` also takes it out of the drag entirely: no box,
         no `pointerdown`, so `draggable` never fires on the desktop layout
         without having to ask what layout it is in. */
      .grip { display: none; }

      /*
        On a phone, a sheet.

        A panel that floats under the player is fine where there is room under
        the player. On a small screen there is not, and the fight is not worth
        having: the same markup docks to the bottom edge, takes the full width,
        and gets a scrim — which is a dialog in everything but the tag, and
        needs no second copy of the station list to be one.
      */
      @media (hover: none), (max-width: 34rem) {
        .stations-wrap {
          position: fixed; inset: auto 0 0 0; top: auto; width: 100%; max-width: none;
          transform: translateY(100%); z-index: 40;
          /* The settings panel's surface and dimmer both, because this is the
             settings panel's shape: a dialog in everything but the tag. */
          background: #0a0908; border-top: 1px solid var(--edge);
          border-radius: 16px 16px 0 0; max-height: 72svh; overflow-y: auto;
          /* Little at the top, because the grip is the top: it carries a
             finger's worth of height of its own and the bar sits in the middle
             of that. The 1.1rem this was is now split between the two. */
          padding: .4rem var(--pad) calc(1.4rem + env(safe-area-inset-bottom));
          transition: transform .28s cubic-bezier(.32, .72, 0, 1), visibility 0s linear .28s;
          opacity: 1;
        }
        body.stations-open .stations-wrap {
          transform: translateY(0);
          transition: transform .28s cubic-bezier(.32, .72, 0, 1), visibility 0s;
        }
        /* Dimmed, not blacked out. At `#000c` the page behind went to almost
           nothing and the sheet read as a screen of its own; the point of a
           scrim is to say the page is still there and is not the thing being
           talked to. Kept in step with the settings backdrop, which is the same
           device over the same page. */
        .scrim {
          display: block; position: fixed; inset: 0; z-index: 30; background: #0009;
          opacity: 0; visibility: hidden;
          transition: opacity .28s ease, visibility 0s linear .28s;
        }
        body.stations-open .scrim {
          opacity: 1; visibility: visible; transition: opacity .28s ease, visibility 0s;
        }
        /* ── the two that are not about the music, in the corners ──────────
           On the desktop row they bracket the transport, dim and ringless, at
           arm's length from the three controls that play something. A phone
           has no room for that bracketing — the row is 3 rem circles and a
           4 rem one across a 20 rem screen — so they leave the row entirely
           and take the two corners a thumb already rests on. What is left in
           the middle is the transport and only the transport: stations, play,
           skip, one circle each side of the accent.

           `fixed`, so they hold the corners of the *screen* rather than of the
           player, which is a centred column that grows with the viewport.
           Neither carries a z-index above the scrim's 30 on purpose: with the
           sheet up they dim underneath it like everything else on the page.

           The insets are the page gutter plus whatever the notch or the home
           bar claims, so on a squared-off screen they sit exactly where the
           deck's own edge is. */
        /* The same gutter all three ways, and its own figure rather than
           `--pad`.

           Equal is the part that matters: these are corner marks, and the only
           thing a corner can be read against is its own two distances. It was
           1.15 down and 1.75 across, which sat the pair visibly nearer the
           bottom edge than the side.

           Tighter than the page gutter, though, and deliberately: `--pad` is
           the margin the *deck* keeps — the width a column of text and cards is
           held in from the edge — and a glyph pushed in that far reads as
           having drifted in off the corner rather than as belonging to it. */
        #open-settings, .vol {
          --corner: 1.05rem;
          position: fixed; bottom: calc(var(--corner) + env(safe-area-inset-bottom));
        }
        #open-settings { left: calc(var(--corner) + env(safe-area-inset-left)); }
        .vol { right: calc(var(--corner) + env(safe-area-inset-right)); }

        /* Bigger than the pair on the desktop row, and for the reason they are
           smaller there: size is relative to what is beside it. In the row they
           are read against 3 rem circles and a 4 rem one, and being the small
           dim things is the whole point. Alone in a corner there is nothing to
           be small against — the nearest control is half a screen away — so the
           same glyph just reads as faint, and it is being found by a thumb
           rather than pointed at.

           Both step by the same 1.21, so the cog stays deliberately under the
           speaker's size and the two go on carrying the same weight of ink. */
        #open-settings, #volume-btn { width: 1.7rem; height: 1.7rem; }
        #open-settings svg { width: 1.35rem; height: 1.35rem; }
        #volume-btn svg { width: 1.7rem; height: 1.7rem; }

        /* Up and over rather than down and centred. Down was right under a
           button in the middle of the page; from the bottom corner the pill
           would open into the home bar, and centred on a button a gutter's
           width from the edge, half of it would hang off the screen. Above and
           flush right does neither, and it lands the pill in the gap between
           the corner and the transport, where nothing else is. */
        .vol-pop {
          left: auto; right: 0; top: auto; bottom: 100%;
          transform: translateY(.25rem);
          margin: 0 0 .45rem;
          /* The two figures swap with the axis: standing the fader up makes the
             padding along the travel the vertical one. Same pair, same
             arithmetic — see the desktop rule. */
          padding: var(--along) var(--across);
        }
        .vol.open .vol-pop { transform: translateY(0); }

        /* ── the fader, upright ───────────────────────────────────────────
           A volume that stands up is the gesture everybody already knows, and
           on this side of the break it is also the only one with room: the
           pill opens out of a bottom corner, and a bar reaching sideways from
           there either runs into the transport or off the screen. Standing, it
           climbs into the empty band above the corner, and the thumb travels
           the way the level does.

           `writing-mode` is what turns the control rather than a `rotate()`.
           A rotated input keeps its own hit box — the box the browser tests
           taps against stays where it was laid out — so the slider would take
           presses from a horizontal strip while showing a vertical bar.
           Turning it in the writing mode turns the layout, so what is drawn
           and what is pressed stay the same shape.

           `direction: rtl` is the other half: `vertical-lr` alone runs the
           value from the top down, which is a fader that gets louder as it
           goes lower. */
        .vol-pop input[type="range"] {
          writing-mode: vertical-lr; direction: rtl;
          width: .9rem; height: 5rem;
        }
        /* The bar, stood on its end: the inset that was left/right is now
           top/bottom, and the gradient climbs instead of running across. Still
           a real box rather than a background, and still inset by half a thumb
           at each end so its ends are where the thumb's centre can reach. */
        .vol-pop::before {
          left: 50%; right: auto; margin: 0 0 0 -2px;
          top: calc(var(--along) + 6px); bottom: calc(var(--along) + 6px);
          width: 4px; height: auto;
          background: linear-gradient(to top, var(--hot) var(--fill, 100%), #241e1b var(--fill, 100%));
        }

        /* Clear of both corners. The failure line is the one thing that can
           appear at the foot of the deck — the player grows to fill the deck,
           so anything after it lands at the bottom of the screen — and a long
           message centred across the full width runs straight under a glyph
           that is fixed on top of it. */
        .oops { padding: 0 3rem; }

        /* The sheet is two columns and its cards are whatever half the screen
           leaves — the 8.5rem the desktop panel asks for is a floor for
           deciding *how many* columns fit, and on the narrowest phones two of
           them no longer do. At 320px the gutter leaves 265px inside the
           sheet, where two 8.5rem cards and their gap want 274, so the grid
           dropped to a single column of full-width cards. 7.5rem clears it
           with room to spare and changes nothing anywhere else: below the
           break the two cards still split whatever is there, and a wide
           touch screen — which lands here on `hover: none`, not on width —
           fits the same number of columns either way. */
        .grid { grid-template-columns: repeat(auto-fit, minmax(7.5rem, 1fr)); }

        /* ── the grip ─────────────────────────────────────────────────────
           A bar, and — separately — something a thumb can catch. Four pixels
           is the right *mark* and an impossible *target*, so the element is a
           finger's worth of height reaching both edges of the sheet, and the
           line is drawn inside it by the pseudo-element. It was a
           pseudo-element outright before this, which is exactly as much as was
           needed while it did nothing.

           `touch-action: none` is what makes the drag possible at all: without
           it the browser claims the vertical axis for its own scrolling and
           pull-to-refresh, and the first `pointermove` that arrives is already
           a cancellation. */
        .grip {
          display: block; position: relative; height: 1.4rem;
          margin: 0 calc(-1 * var(--pad)); touch-action: none; cursor: grab;
        }
        .grip:active { cursor: grabbing; }
        .grip::before {
          content: ""; position: absolute; left: 50%; top: 50%;
          width: 2.25rem; height: 4px; margin: -2px 0 0 -1.125rem;
          border-radius: 2px; background: var(--edge);
        }

        /* The settings become a sheet too — but their rules cannot live here.
           The `dialog` block they override is written further down, and on
           equal specificity the later rule wins whether or not it is in a media
           query, so a copy of it up here would be quietly overwritten by the
           desktop card. They are at the foot of this stylesheet instead, under
           the same query. */
      }
      @media (prefers-reduced-motion: reduce) {
        .stations-wrap, .scrim { transition-duration: 0s; }
      }

      h2 {
        font-size: .62rem; text-transform: uppercase; letter-spacing: .13em;
        color: var(--dim); font-weight: 500; margin: 0 0 .6rem; opacity: .7;
      }
      /* Four across where there is room for four, two on a phone — the eight
         fit the width they are given rather than a fixed pair of columns. */
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(8.5rem, 1fr)); gap: .4rem; }
      .grid button {
        text-align: left; padding: .55rem .65rem; border-radius: 9px;
        border: 1px solid transparent; background: #141110; color: var(--dim);
        font: inherit; cursor: pointer; overflow: hidden;
        transition: color .18s ease, border-color .18s ease, transform var(--squish, var(--bounce));
      }
      .grid button:hover { color: var(--ink); }
      /* Less than the transport takes, because a fraction is not a distance and
         the card is a wide box rather than a circle: the same figure buys three
         times the travel across 143 px that it does across a 3 rem button, and
         the card has a .4rem gap to barge its neighbours over. Matched by the
         pixel instead — about a pixel of movement at each end, which is what the
         transport gets.

         Only where there is a pointer, too. `:hover` sticks to the last thing
         tapped on a touch screen — the note at `.aimed` is about exactly this —
         and a card left standing 2% proud of the other eleven says the sheet is
         still waiting on a choice that has already been made. The colour has the
         same fault and has always had it; a size need not join in. */
      @media (hover: hover) {
        .grid button:hover { transform: scale(1.015); }
      }
      /* After the hover rule, and it has to be: the two selectors weigh the
         same, a media query adds nothing to that weight, and a tie is settled by
         which was written last. The other way round, a card pressed under the
         pointer — which is every card pressed with a mouse — would answer with
         the hover size and no dip at all.

         Shallower than the transport's press for the reason the growth is
         smaller: measured in pixels the two dip by about the same amount, and it
         takes a much smaller fraction to do it over this width. Deeper and the
         card reads as a wobble rather than as a click. */
      .grid button:active { --squish: var(--dip); transform: scale(.978); }
      /* The current station is named in the accent and nothing else changes —
         a filled box for the one you are already listening to would be the
         loudest thing under a player it is not part of. */
      .grid button[aria-current="true"] { color: var(--hot); border-color: var(--hot); }
      .grid b { display: block; font-size: .82rem; font-weight: 600; white-space: nowrap;
                overflow: hidden; text-overflow: ellipsis; }
      /* What the station contains, in genre names, derived from the table
         rather than written about it — see `sourceLabel`.

         One line, always. A label too wide for its card slides across and back
         instead of wrapping, which keeps every card the same height whatever is
         written on it. `radio.ts` measures the overflow and only marks the ones
         that actually need it. */
      .grid span {
        display: block; margin-top: .1rem; font-size: .67rem; line-height: 1.35;
        color: var(--dim); opacity: .75;
        white-space: nowrap; overflow: hidden;
      }
      .grid span > i { display: inline-block; font-style: normal; }
      .grid span.scroll > i {
        animation: label-slide var(--dur, 9s) ease-in-out infinite alternate;
      }
      /* Long holds at both ends, so it reads as a line that occasionally shows
         you its tail rather than a ticker. */
      @keyframes label-slide {
        0%, 18% { transform: translateX(0); }
        82%, 100% { transform: translateX(var(--shift, 0)); }
      }
      @media (prefers-reduced-motion: reduce) {
        .grid span.scroll > i { animation: none; }
      }

      /* Hidden until something actually fails. A line that is always there,
         saying nothing, teaches people not to read it. */
      .oops { color: #e2705a; font-size: .82rem; margin-top: 1.25rem; text-align: center; }
      .oops[hidden] { display: none; }

      /* ── ?debug ───────────────────────────────────────────────────────────
         Off unless the address bar asks for it. This is the seam back to the
         bench: the same record, opened in the page that has every control. */
      .debug[hidden] { display: none; }
      .debug {
        margin-top: 1.5rem; padding-top: .9rem; border-top: 1px solid var(--edge);
        display: flex; align-items: center; gap: .7rem; flex-wrap: wrap;
        font-size: .72rem; color: var(--dim);
      }
      .debug a, .debug button {
        color: var(--dim); background: none; font: inherit;
        border: 1px solid var(--edge); border-radius: 7px; padding: .25rem .55rem; cursor: pointer;
        text-decoration: none;
      }
      .debug a:hover, .debug button:hover { color: var(--hot); border-color: var(--hot); }
      .debug code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: .7rem; opacity: .7;
      }

      /* ── settings ───────────────────────────────────────────────────────
         Darker than the page it opens over, not lighter, which is the usual
         way round and the wrong one here. The backdrop takes the page down
         before the dialog is drawn at all, so a panel *lighter* than the page
         is the brightest thing on a screen you are meant to glance at and
         dismiss. Under the dim, #0a0908 still reads as a lit surface — it is
         the two controls on it, a step above, that carry the panel's shape
         rather than the panel itself. */
      dialog {
        border: 1px solid var(--edge); border-radius: 18px; background: #0a0908; color: var(--ink);
        width: min(23rem, calc(100vw - 2 * var(--pad))); padding: 1.5rem 1.5rem 1.25rem;
        box-shadow: 0 24px 60px #000c;
        opacity: 0; transform: scale(.97);
        transition:
          opacity .22s ease, transform .22s cubic-bezier(.32, .72, 0, 1),
          overlay .22s allow-discrete, display .22s allow-discrete;
      }
      dialog[open] { opacity: 1; transform: none; }
      /* Enough to take the page out of the argument, not enough to pretend it
         has gone. The blur does most of the work of separating the two, so the
         dim does not have to be near-black to be read as one — and the page
         behind is the thing the settings are about. `.scrim` carries the same
         figure for the stations sheet. */
      dialog::backdrop {
        background: #0009; backdrop-filter: blur(2px);
        opacity: 0;
        transition: opacity .22s ease, overlay .22s allow-discrete, display .22s allow-discrete;
      }
      dialog[open]::backdrop { opacity: 1; }
      /* The card grows the last three per cent of its way in and fades as it
         does, and both of those need `@starting-style` to happen at all: a
         dialog is `display: none` until it opens, so there is no before-change
         style to move *from* and it would simply be there. `allow-discrete` is
         the other half of the same problem at the other end — it holds
         `display` and `overlay` at their old values for the length of the
         transition, which is what lets the card be seen leaving. Without it
         `close()` takes it off the screen in one frame. The phone's sheet has
         wanted both since it was written; the card was the one that cut.

         Three per cent, and the dim behind it is the reason it can be that
         little. A panel arriving over a page that is dimming at the same moment
         is already the largest change on the screen, so the card only has to
         come the last of the way to meet it — more and it is a card thrown at
         you. The scale rides the sheet's own curve, which is most of its travel
         spent slowing down; the fade is plain, because a fade with a shape is a
         fade you can see the working of. */
      @starting-style {
        dialog[open] { opacity: 0; transform: scale(.97); }
        dialog[open]::backdrop { opacity: 0; }
      }
      .dlg-title {
        margin: 0 0 1.4rem; font-size: 1.05rem; font-weight: 600; letter-spacing: .01em;
      }
      dialog section + section { margin-top: 1.6rem; }
      dialog h2 { margin: 0 0 .6rem; opacity: .7; }

      /* One track with the choice sitting inside it, rather than three buttons
         with three borders — a row of equal outlined boxes reads as three
         separate controls instead of one setting with three positions. */
      .seg {
        display: flex; gap: .25rem; padding: .25rem;
        background: #141110; border: 1px solid var(--edge); border-radius: 11px;
      }
      .seg button {
        flex: 1; padding: .5rem .3rem; border-radius: 8px; font: inherit; font-size: .8rem;
        border: 0; background: transparent; color: var(--dim); cursor: pointer;
        transition: background .18s ease, color .18s ease, transform var(--squish, var(--bounce));
      }
      .seg button:hover { color: var(--ink); }
      /* The dip and no growth. These three sit shoulder to shoulder inside one
         track, and a segment that swells on hover is a segment climbing out of
         the box that says the three are one control. Pressed, it dips *into*
         the track, which is the shape saying what it is — by a couple of pixels
         at each end, matched to the dip the rest of the page takes rather than
         to its fraction. */
      .seg button:active { --squish: var(--dip); transform: scale(.962); }
      .seg button[aria-pressed="true"] {
        background: var(--hot); color: #17110a; font-weight: 600;
      }

      /* What the slider is set to, said in words rather than labelled at its
         ends. "Keep it steady ⟷ Surprise me" described the control; this
         describes the music, which is the thing being chosen. */
      .reading {
        display: flex; align-items: baseline; flex-wrap: wrap; gap: .1rem .45rem;
        margin-top: .5rem; min-height: 1.4rem;
      }
      .reading b { font-size: .78rem; font-weight: 600; color: var(--hot); }
      .reading span { font-size: .74rem; color: var(--dim); }
      input[type="range"] {
        -webkit-appearance: none; appearance: none;
        width: 100%; height: 1.5rem; background: transparent; cursor: pointer;
      }
      input[type="range"]::-webkit-slider-runnable-track {
        height: 4px; border-radius: 2px;
        background: linear-gradient(to right, var(--hot) var(--fill, 50%), #241e1b var(--fill, 50%));
      }
      input[type="range"]::-moz-range-track {
        height: 4px; border-radius: 2px;
        background: linear-gradient(to right, var(--hot) var(--fill, 50%), #241e1b var(--fill, 50%));
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none; appearance: none;
        width: 14px; height: 14px; margin-top: -5px; border-radius: 50%; background: var(--ink);
      }
      input[type="range"]::-moz-range-thumb {
        width: 14px; height: 14px; border: 0; border-radius: 50%; background: var(--ink);
      }
      .done {
        width: 100%; margin-top: 1.75rem; padding: .65rem; border-radius: 10px;
        border: 1px solid var(--edge); background: #141110; color: var(--ink);
        font: inherit; font-size: .85rem; cursor: pointer;
        transition: border-color .18s ease, color .18s ease, transform var(--squish, var(--bounce));
      }
      .done:hover { border-color: var(--hot); color: var(--hot); }
      /* Shallower still: it is the width of the panel, and a bar that long
         changes size at both ends at once. Growing on hover it would be a bar
         reaching past the dialog's own padding, so it does not. */
      .done:active { --squish: var(--dip); transform: scale(.986); }

      /* ── the settings, as a sheet ───────────────────────────────────────
         The same dialog, docked. A centred card is right on a screen you are
         looking at and wrong on one you are holding: it lands in the middle,
         which is the part of a phone a thumb reaches last, and it arrives from
         nowhere and leaves the same way. The stations already dock to the
         bottom edge on this side of the break, and the settings are the same
         kind of thing — asked for, glanced at, put away — so they arrive by the
         same slide and leave by the same pull.

         Down here rather than up with the rest of the phone layout, and the
         placement is load-bearing: every declaration in this block overrides
         one written just above it at the same specificity, and on equal
         specificity the later rule wins whether or not it is inside a media
         query. Written in the phone block, all of this would be silently undone
         by the desktop card's own rules.

         `margin: auto auto 0` is the whole of the docking. A modal dialog is
         given `position: fixed; inset: 0; margin: auto` by the browser itself,
         so pinning one edge's margin to zero is what decides which edge it sits
         against — no `position` of our own, and nothing that would take it out
         of the top layer or off the `::backdrop` that comes with being there.

         The slide needs `@starting-style`, and that is not garnish: a dialog is
         `display: none` until it opens, so there is no before-change style for
         the transform to move *from* and the sheet would simply appear at its
         dock. `allow-discrete` is the other half — it holds `display` and
         `overlay` at their old values for the length of the transition, which
         is what lets the sheet be seen on the way *out*. Without it `close()`
         takes it off the screen in the same frame and the exit is a
         disappearance. */
      @media (hover: none), (max-width: 34rem) {
        dialog {
          width: 100%; max-width: none; margin: auto auto 0;
          border-width: 1px 0 0; border-radius: 16px 16px 0 0;
          max-height: 88svh; overflow-y: auto;
          /* Little at the top for the same reason the stations sheet has
             little: the grip is the top, and it carries its own height. More
             at the foot than the card keeps, because the button that used to
             hold that space is gone from this layout — see `.done` below. */
          padding: .4rem var(--pad) calc(2rem + env(safe-area-inset-bottom));
          /* Upwards, because that is the only edge with a page behind it. */
          box-shadow: 0 -18px 50px #000a;
          transform: translateY(100%);
          /* Opaque throughout, which the card is not, and this is the line that
             says so — the sheet takes the transform and leaves the fade. A
             sheet is attached to the edge it comes from and travelling is the
             whole of what it does; fading as well would be it arriving and
             materialising at once. Pinned rather than left alone because the
             card's `opacity: 0` sits on the same selector further up, and the
             transition below does not carry opacity to move it back. */
          opacity: 1;
          transition:
            transform .3s cubic-bezier(.32, .72, 0, 1),
            overlay .3s allow-discrete, display .3s allow-discrete;
        }
        dialog[open] { transform: translateY(0); }
        dialog::backdrop {
          opacity: 0;
          transition: opacity .3s ease, overlay .3s allow-discrete, display .3s allow-discrete;
        }
        dialog[open]::backdrop { opacity: 1; }
        @starting-style {
          /* Both of these override the card's own starting style, and the
             opacity is here for the same reason it is pinned above: left off,
             the sheet would begin its slide at the card's `0` and jump to full
             on the next frame, since the sheet's transition does not carry
             opacity to fade it. It is off the bottom of the screen for that
             one frame, so nothing shows — an accident, not an arrangement. */
          dialog[open] { transform: translateY(100%); opacity: 1; }
          dialog[open]::backdrop { opacity: 0; }
        }
        /* The grip has already put the title a good way down the sheet, and it
           does not need a card's worth of air under it as well. */
        .dlg-title { margin-bottom: 1.1rem; }
        /* No Done. The card has one because a card gives you nothing else —
           the backdrop is a guess and Escape is a keyboard. A sheet says how it
           leaves in its own shape: the grip at the top is the affordance, and
           pulling it down is both quicker and more certain than reaching for a
           button. Left in, it would be a second way to do the thing the sheet
           already announces, taking the widest line on the panel to say it. */
        .done { display: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        dialog, dialog::backdrop { transition-duration: 0s; }
      }
      /* Every press on the page, stilled in two lines, because every press on
         the page spends the same two figures — see `--bounce`. The states all
         survive: a pressed button is still smaller and a hovered one still
         larger, they simply arrive there rather than travel. The icon's
         cross-fade stays too, at its own duration, for the same reason the
         station labels keep their colour — a fade is not a movement.

         Last in the sheet on purpose: this is `:root` overriding `:root`, which
         is a tie on specificity, and a tie goes to whoever is written later. */
      @media (prefers-reduced-motion: reduce) {
        :root { --bounce: 0s; --dip: 0s; }
      }
    </style>
  </head>
  <body class="booting">
    <main class="deck">
      <section class="player">
        <div class="title-box"><h1 class="title" id="title"></h1></div>
        <div class="sub-box"><div class="sub" id="sub"></div></div>
        <div class="era" id="era"></div>

        <!-- The `<i>` is the tight rim of the halo. See `.glow`. -->
        <div class="glow" aria-hidden="true"><i></i></div>

        <div class="controls">
          <div class="side left">
            <button id="open-settings" aria-label="Settings">
              <!-- Solid, and built out of shapes rather than one hand-written
                   outline path: the hole is a mask, so it reads as a gear at
                   20 px instead of a tangle of curves. -->
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <mask id="cog-hole">
                  <rect width="24" height="24" fill="#fff" />
                  <circle cx="12" cy="12" r="3.15" fill="#000" />
                </mask>
                <g mask="url(#cog-hole)">
                  <circle cx="12" cy="12" r="7.3" />
                  <rect x="10.4" y="1.6" width="3.2" height="20.8" rx="1.5" />
                  <rect x="10.4" y="1.6" width="3.2" height="20.8" rx="1.5" transform="rotate(45 12 12)" />
                  <rect x="10.4" y="1.6" width="3.2" height="20.8" rx="1.5" transform="rotate(90 12 12)" />
                  <rect x="10.4" y="1.6" width="3.2" height="20.8" rx="1.5" transform="rotate(135 12 12)" />
                </g>
              </svg>
            </button>
            <button id="stations-toggle" aria-expanded="false" aria-controls="stations-wrap"
                    aria-label="Stations">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="2.1" fill="currentColor" stroke="none" />
                <path d="M8.4 8.4a5.1 5.1 0 0 0 0 7.2M15.6 15.6a5.1 5.1 0 0 0 0-7.2" />
                <path d="M5.6 5.6a9.1 9.1 0 0 0 0 12.8M18.4 18.4a9.1 9.1 0 0 0 0-12.8" />
              </svg>
            </button>
          </div>
          <button id="play" data-state="load" aria-label="Loading">
            <!-- Drawn 1.4 in from the triangle it looks like: the stroke on it
                 puts that back on a round join. Outer points (7, 4.5),
                 (7, 19.5), (19.5, 12), which is the shape this always was. -->
            <svg viewBox="0 0 24 24" data-when="play" aria-hidden="true"><path d="M8.4 6.97v10.06l8.38-5.03z" /></svg>
            <svg viewBox="0 0 24 24" data-when="pause" aria-hidden="true">
              <rect x="6.5" y="5" width="4" height="14" rx="1.4" />
              <rect x="13.5" y="5" width="4" height="14" rx="1.4" />
            </svg>
          </button>
          <div class="side right">
            <button id="skip" aria-label="Next record" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <!-- Inset by 1, and stroked back out, for the reason Play's is:
                     the bar beside it is rounded at 1 and the wedge was not.
                     Outer points (6, 5.5), (6, 18.5), (15.5, 12). -->
                <path d="M7 7.4v9.2l6.73-4.6z" /><rect x="16.5" y="5.5" width="2.4" height="13" rx="1" />
              </svg>
            </button>
            <div class="vol" id="vol">
              <button id="volume-btn" aria-label="Volume" aria-expanded="false" data-level="2">
                <!-- The cone is drawn smaller than it wants to be. It carries
                     the same colour and opacity as the cog, but a solid wedge
                     that size out-weighed the gear's finer shape and read as
                     the brighter of the two. -->
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M10.4 6.4v11.2l-4.1-3.2H3.6V9.6h2.7z" />
                  <path class="wave" d="M13.8 9.8a3.2 3.2 0 0 1 0 4.4" />
                  <path class="wave2" d="M16.2 7.4a6.5 6.5 0 0 1 0 9.2" />
                </svg>
              </button>
              <div class="vol-pop" id="vol-pop">
                <input id="volume" type="range" min="0" max="100" step="1" value="80"
                       aria-label="Volume" />
              </div>
            </div>
          </div>
        </div>

        <div class="stations-anchor">
          <div class="stations-wrap" id="stations-wrap" role="group" aria-label="Stations">
            <!-- The bar a thumb pulls the sheet down by. Nothing above the
                 phone break, where this is a floating panel rather than a
                 sheet — see `.grip`. -->
            <div class="grip" id="stations-grip" aria-hidden="true"></div>
            <div class="grid" id="stations"></div>
          </div>
        </div>
      </section>

      <div class="scrim" id="scrim"></div>

      <p class="oops" id="oops" hidden></p>

      <div class="debug" id="debug" hidden>
        <a id="debug-open" href="/" target="_blank" rel="noopener">Open in generator ↗</a>
        <button id="debug-copy" type="button">Copy link</button>
        <code id="debug-ref"></code>
      </div>
    </main>

    <dialog id="settings" aria-labelledby="dlg-title">
      <div class="grip" id="settings-grip" aria-hidden="true"></div>
      <h3 class="dlg-title" id="dlg-title">Settings</h3>

      <section>
        <h2>Voice</h2>
        <div class="seg" id="voice">
          <button type="button" data-voice="instrumental">Instrumental</button>
          <button type="button" data-voice="mixed">Mixed</button>
          <button type="button" data-voice="sung">Sung</button>
        </div>
      </section>

      <!--
        Which of the two glows is on show.

        Both are real and complete: the plain one is the three CSS layers
        described up in `.glow`, and the live one is `web/glow-field.ts` drawing
        the same bar as gas you can cut. The plain one is also what a machine
        without WebGL2 gets, and what everybody gets if the context is lost, so
        this is a choice between two states the page already has to be able to
        be in rather than a feature that can be switched off.
      -->
      <section>
        <h2>Glow</h2>
        <div class="seg" id="glow-mode">
          <button type="button" data-glow="particles">Particles</button>
          <button type="button" data-glow="plain">Plain</button>
        </div>
      </section>

      <!--
        Variety, shelved rather than deleted.

        Every station runs at `DEFAULT_WANDER` while this is hidden — see
        `boot`, which stops reading the stored value so a figure set before the
        control disappeared cannot go on quietly shaping the output with no way
        to see or change it. Taking the `hidden` off and restoring that one line
        brings it back.
      -->
      <section hidden>
        <h2>Variety</h2>
        <input id="wander" type="range" min="0" max="100" step="5" value="50"
               aria-label="How far the station wanders"
               aria-describedby="wander-name wander-gloss" />
        <div class="reading">
          <b id="wander-name"></b><span id="wander-gloss"></span>
        </div>
      </section>

      <button class="done" id="close-settings" type="button">Close</button>
    </dialog>

    <script type="module" src="/src/web/radio.ts"></script>
  </body>
</html>
