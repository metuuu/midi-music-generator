<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Radio — a rule-based music generator, nineteen genres</title>
    <meta
      name="description"
      content="A rule-based generator for instrumental music in nineteen genres — form, harmony, melody, bass, comping and drums, written from scratch and played in your browser."
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#14100e" />
    <link rel="canonical" href="https://midi.poppodi.click/" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Radio — music generator" />
    <meta property="og:title" content="Radio — a rule-based music generator, nineteen genres" />
    <meta
      property="og:description"
      content="Form, harmony, melody, bass and drums, written from scratch and played in the browser. A seed reproduces a song exactly."
    />
    <meta property="og:url" content="https://midi.poppodi.click/" />
    <meta property="og:image" content="https://midi.poppodi.click/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Radio — a rule-based music generator, nineteen genres" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      :root {
        --bg: #14100e;
        --panel: #1e1917;
        --edge: #372e29;
        --ink: #efe6dc;
        --dim: #a2938a;
        --hot: #e0a24a;
        --hot-2: #c4623a;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
        display: flex; justify-content: center; padding: 2rem 1rem;
      }
      .wrap { width: 100%; max-width: 860px; }
      h1 { font-size: 1.35rem; margin: 0 0 .25rem; letter-spacing: .02em; }
      .sub { color: var(--dim); font-size: .85rem; margin-bottom: 1.5rem; }
      .panel {
        background: var(--panel); border: 1px solid var(--edge);
        border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem;
      }
      .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: .85rem; }
      label { display: block; font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin-bottom: .35rem; }
      select, input {
        width: 100%; padding: .5rem .6rem; background: #100d0c; color: var(--ink);
        border: 1px solid var(--edge); border-radius: 7px; font-size: .9rem; font-family: inherit;
      }
      .row { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: 1.1rem; }
      button {
        padding: .6rem 1.1rem; border-radius: 7px; border: 1px solid var(--edge);
        background: #2a2320; color: var(--ink); font-size: .9rem; cursor: pointer; font-family: inherit;
      }
      button:hover:not(:disabled) { border-color: var(--hot); }
      button.primary { background: var(--hot); color: #17110a; border-color: var(--hot); font-weight: 600; }
      button:disabled { opacity: .45; cursor: not-allowed; }
      .now { display: flex; align-items: baseline; gap: .7rem; flex-wrap: wrap; }
      .title { font-size: 1.5rem; font-weight: 600; }
      .meta { color: var(--dim); font-size: .85rem; line-height: 1.7; margin-top: .5rem; }
      .meta b { color: var(--ink); font-weight: 500; }
      .form-strip { display: flex; gap: 3px; margin-top: .9rem; flex-wrap: wrap; }
      .seg {
        font-size: .68rem; padding: .25rem .5rem; border-radius: 4px;
        background: #2a2320; color: var(--dim); border: 1px solid transparent;
      }
      .seg.chorus { background: #43301f; color: var(--hot); }
      .seg.solo { background: #3a2430; color: #d090c0; }
      .seg.lift { border-color: var(--hot); color: var(--hot); }
      .layers-label { margin-top: 1rem; margin-bottom: 0; }
      .layers { display: flex; gap: .4rem; flex-wrap: wrap; margin-top: .45rem; }
      .layer {
        font-size: .72rem; padding: .3rem .6rem; border-radius: 20px;
        border: 1px solid var(--edge); color: var(--dim); cursor: pointer; user-select: none;
      }
      .layer.on { border-color: var(--hot); color: var(--hot); }
      details { margin-top: 1rem; }
      summary { cursor: pointer; color: var(--dim); font-size: .85rem; }
      pre {
        background: #100d0c; border: 1px solid var(--edge); border-radius: 8px;
        padding: .9rem; overflow: auto; max-height: 340px; font-size: .74rem; line-height: 1.5;
        color: #cfc3b6; margin-top: .7rem;
      }
      .status { font-size: .8rem; color: var(--dim); margin-top: .8rem; min-height: 1.2em; }
      .status.err { color: #e2705a; }
      .hint { font-size: .78rem; color: var(--dim); margin-top: .7rem; font-style: italic; }
      .check { display: flex; align-items: center; gap: .5rem; padding: .5rem 0; font-size: .85rem; }
      .check input { width: auto; accent-color: var(--hot); margin: 0; }
      .compare { margin-top: 1.1rem; padding-top: 1rem; border-top: 1px solid var(--edge); }
      .compare .row { margin-top: .6rem; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Radio</h1>
      <div class="sub">
        Rule-based music generator — nineteen genres, auditioned through Strudel ·
        <a href="/voice.html" style="color: var(--hot)">voice lab →</a> ·
        <a href="/mix.html" style="color: var(--hot)">mix lab →</a> ·
        <a href="/bench.html" style="color: var(--hot)">instrument bench →</a> ·
        <a href="/concert.html" style="color: var(--hot)">concert →</a>
      </div>

      <div class="panel">
        <div class="controls">
          <div>
            <label for="genre">Genre</label>
            <select id="genre"></select>
          </div>
          <div>
            <label for="mood">Mood</label>
            <select id="mood"></select>
          </div>
          <div>
            <label for="era">Era</label>
            <select id="era"></select>
          </div>
          <div>
            <label for="style">Style</label>
            <select id="style"></select>
          </div>
          <div>
            <label for="strictness">Smoothness</label>
            <select id="strictness"></select>
          </div>
          <div>
            <label for="hook">Hook</label>
            <select id="hook"></select>
          </div>
          <div>
            <label for="seed">Seed</label>
            <input id="seed" type="text" placeholder="random" />
          </div>
          <div>
            <label for="vocals">Voice</label>
            <div class="check">
              <input id="vocals" type="checkbox" />
              <span>Sung vocal</span>
            </div>
          </div>
        </div>
        <div class="hint" id="strictness-hint"></div>
        <div class="hint" id="hook-hint"></div>
        <div class="row">
          <button id="play" class="primary" disabled>Loading…</button>
          <button id="next" disabled>Next ▸</button>
          <button id="radio" disabled>Radio mode: off</button>
          <button id="watch">Watch on stage ▸</button>
          <button id="dl" disabled>Download MIDI</button>
        </div>
        <div class="status" id="status"></div>
      </div>

      <div class="panel">
        <div class="now">
          <span class="title" id="title">—</span>
        </div>
        <div class="meta" id="meta"></div>
        <div class="form-strip" id="form"></div>
        <label class="layers-label">Layers — click to mute, live</label>
        <div class="layers" id="layers"></div>
        <details>
          <summary>Generated Strudel code</summary>
          <pre id="code"></pre>
        </details>
      </div>
    </div>
    <script type="module" src="/src/web/main.ts"></script>
  </body>
</html>
