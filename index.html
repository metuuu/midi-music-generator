<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Radio — a rule-based music generator, nineteen genres</title>
    <meta
      name="description"
      content="A rule-based generator for instrumental music in nineteen genres — form, harmony, melody, bass, comping and drums, written from scratch and played in your browser."
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#14100e" />
    <link rel="canonical" href="https://midi.poppodi.click/" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Radio — music generator" />
    <meta property="og:title" content="Radio — a rule-based music generator, nineteen genres" />
    <meta
      property="og:description"
      content="Form, harmony, melody, bass and drums, written from scratch and played in the browser. A seed reproduces a song exactly."
    />
    <meta property="og:url" content="https://midi.poppodi.click/" />
    <meta property="og:image" content="https://midi.poppodi.click/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Radio — a rule-based music generator, nineteen genres" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      :root {
        --bg: #14100e;
        --panel: #1e1917;
        --edge: #372e29;
        --ink: #efe6dc;
        --dim: #a2938a;
        --hot: #e0a24a;
        --hot-2: #c4623a;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      /* No tap flash: Android's Chrome paints a blue rectangle over whatever a
         finger lands on, and it lands on our buttons, chips and panels. */
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      body {
        margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
        display: flex; justify-content: center; padding: 2rem 1rem;
      }
      .wrap { width: 100%; max-width: 860px; }
      h1 { font-size: 1.35rem; margin: 0 0 .25rem; letter-spacing: .02em; }
      .sub { color: var(--dim); font-size: .85rem; margin-bottom: 1.5rem; }
      .panel {
        background: var(--panel); border: 1px solid var(--edge);
        border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem;
      }
      .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: .85rem; }
      label { display: block; font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin-bottom: .35rem; }
      select, input {
        width: 100%; padding: .5rem .6rem; background: #100d0c; color: var(--ink);
        border: 1px solid var(--edge); border-radius: 7px; font-size: .9rem; font-family: inherit;
      }
      .row { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: 1.1rem; }
      button {
        padding: .6rem 1.1rem; border-radius: 7px; border: 1px solid var(--edge);
        background: #2a2320; color: var(--ink); font-size: .9rem; cursor: pointer; font-family: inherit;
      }
      button:hover:not(:disabled) { border-color: var(--hot); }
      button.primary { background: var(--hot); color: #17110a; border-color: var(--hot); font-weight: 600; }
      button:disabled { opacity: .45; cursor: not-allowed; }
      .now { display: flex; align-items: baseline; gap: .7rem; flex-wrap: wrap; }
      .title { font-size: 1.5rem; font-weight: 600; }
      .meta { color: var(--dim); font-size: .85rem; line-height: 1.7; margin-top: .5rem; }
      .meta b { color: var(--ink); font-weight: 500; }
      .form-strip { display: flex; gap: 3px; margin-top: .9rem; flex-wrap: wrap; }
      .seg {
        font-size: .68rem; padding: .25rem .5rem; border-radius: 4px;
        background: #2a2320; color: var(--dim); border: 1px solid transparent;
      }
      .seg.chorus { background: #43301f; color: var(--hot); }
      .seg.solo { background: #3a2430; color: #d090c0; }
      .seg.lift { border-color: var(--hot); color: var(--hot); }
      .layers-label { margin-top: 1rem; margin-bottom: 0; }
      .layers { display: flex; gap: .4rem; flex-wrap: wrap; margin-top: .45rem; }
      .layer {
        font-size: .72rem; padding: .3rem .6rem; border-radius: 20px;
        border: 1px solid var(--edge); color: var(--dim); cursor: pointer; user-select: none;
      }
      .layer.on { border-color: var(--hot); color: var(--hot); }
      details { margin-top: 1rem; }
      summary { cursor: pointer; color: var(--dim); font-size: .85rem; }
      pre {
        background: #100d0c; border: 1px solid var(--edge); border-radius: 8px;
        padding: .9rem; overflow: auto; max-height: 340px; font-size: .74rem; line-height: 1.5;
        color: #cfc3b6; margin-top: .7rem;
      }
      .status { font-size: .8rem; color: var(--dim); margin-top: .8rem; min-height: 1.2em; }
      .status.err { color: #e2705a; }
      /* Chaos: five independent boxes and the rate that applies to them, kept
         together and given a rule above, because the pair is one control and
         everything else in the panel is a single field. */
      .controls .span.chaos {
        display: flex; flex-wrap: wrap; gap: .85rem 2rem; align-items: flex-start;
        border-top: 1px solid var(--edge); padding-top: .8rem; margin-top: .1rem;
      }
      .controls .span.chaos .mixing-block { min-width: 190px; }
      /* Advanced takes the row: six sliders beside the boxes would be a column
         190px wide with six things in it. */
      .controls .span.chaos .mixing-block.wide { flex: 1 1 100%; }
      /* Set like a `label`, because that is what it is standing in for — a
         label may not contain a button, and the chip belongs to this heading
         rather than to the row of boxes, which is a different control. */
      .mixing-head {
        display: flex; align-items: center; gap: .5rem; margin-bottom: .35rem;
        font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--dim);
      }
      /* One slider per ticked kind, each under about as much space as its name
         needs. Kinds that are not ticked are absent rather than greyed: the row
         above already says they are off, and saying it twice in six dead
         sliders is a panel that looks broken. */
      /* Columns capped at the width the single slider has rather than stretched
         to fill the row: a rate is the same control whichever panel it is in,
         and one that got longer because there were three of them would be
         three different-looking controls doing the same job. */
      .mixing-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 190px)); gap: .25rem 1.6rem;
      }
      .mixing-grid[hidden] { display: none; }
      /* Under the rates and the width of one of them: it belongs to the same
         panel, and it is not a rate. */
      .chaos-seed { max-width: 190px; margin-top: .55rem; }
      .chaos-seed input { padding: .35rem .5rem; font-size: .8rem; }
      /* Name on the left, rate on the right — the number is the thing you are
         setting and it should not have to be read off the thumb's position. */
      .mixing-grid label { display: flex; justify-content: space-between; gap: .5rem; margin-bottom: .1rem; }
      .mixing-grid label b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
      /*
        The slider was picking up the `select, input` rule above — a padded,
        bordered text box with a native track sitting inside it. That is why it
        came out in the browser's own accent instead of the panel's, and why it
        never looked full: the padding inset the track, so a value of 100 left a
        strip of unfilled bar past the thumb.

        Styled explicitly instead. The fill is a gradient driven by `--fill`,
        which `main.ts` sets from the value, because a native range gives no way
        to paint the track up to the thumb — so at 100 the bar is 100% hot, which
        is the one thing the control has to be able to say.
      */
      input[type="range"] {
        -webkit-appearance: none; appearance: none;
        width: 100%; height: 1.5rem; padding: 0; border: 0; background: transparent;
        cursor: pointer;
      }
      input[type="range"]::-webkit-slider-runnable-track {
        height: 6px; border-radius: 3px; border: 1px solid var(--edge);
        background: linear-gradient(to right, var(--hot) var(--fill, 50%), #100d0c var(--fill, 50%));
      }
      input[type="range"]::-moz-range-track {
        height: 6px; border-radius: 3px; border: 1px solid var(--edge);
        background: linear-gradient(to right, var(--hot) var(--fill, 50%), #100d0c var(--fill, 50%));
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none; appearance: none;
        width: 14px; height: 14px; margin-top: -5px; border-radius: 50%;
        background: var(--ink); border: 1px solid var(--edge);
      }
      input[type="range"]::-moz-range-thumb {
        width: 14px; height: 14px; border-radius: 50%;
        background: var(--ink); border: 1px solid var(--edge);
      }
      input[type="range"]:disabled { opacity: .4; cursor: not-allowed; }
      input[type="range"]:hover:not(:disabled)::-webkit-slider-thumb { border-color: var(--hot); }
      input[type="range"]:hover:not(:disabled)::-moz-range-thumb { border-color: var(--hot); }
      /*
        `full chaos` sits at the end of the boxes it sets, and borrows the layer
        chips' shape rather than the buttons': it is the same kind of object —
        a small thing that is either on or off and says which by its colour —
        and the panel already taught that idiom two rows down.
      */
      button.chip {
        /* Set like the boxes it belongs with — same size, same caps, same
           tracking — so the row reads as one line of controls rather than a
           label with a widget stuck on the end. */
        font-size: .76rem; text-transform: uppercase; letter-spacing: .08em;
        line-height: 1.35; padding: .16rem .55rem;
        border-radius: 999px; width: auto;
        /* Outline in the text's own colour rather than the panel's edge, so the
           pill reads as one drawn shape instead of a label inside a box. */
        border: 1px solid var(--dim); background: transparent; color: var(--dim);
        cursor: pointer; font-family: inherit; margin-left: .2rem;
      }
      /* Filled when it is on, like `button.primary` — an outline says "you may
         press this" and a fill says "this is what is happening", and the second
         is what the chip is for. */
      button.chip.on {
        background: var(--hot); border-color: var(--hot); color: #17110a; font-weight: 600;
      }
      button.chip:hover { border-color: var(--hot); }
      /* Smaller again inside a heading: it is a switch on the control below it
         rather than one of the things being controlled. */
      button.chip.mini { font-size: .66rem; letter-spacing: .06em; padding: .08rem .45rem; margin-left: 0; }
      .checks { display: flex; flex-wrap: wrap; align-items: center; gap: .1rem 1rem; padding-top: .15rem; }
      /* The global `label` rule gives every one of these a bottom margin, which
         `align-items: center` cannot see past — it centres the boxes and leaves
         the text sitting higher than the chip beside it. Dropped here so the row
         lines up on its baseline. */
      .checks .check { margin-bottom: 0; }
      /* Its own row: five boxes read as a set of choices, where five cells of a
         150px grid would read as five unrelated controls. */
      .span { grid-column: 1 / -1; }
      .checks .check { font-size: .82rem; }
      .hint { font-size: .78rem; color: var(--dim); margin-top: .7rem; font-style: italic; }
      .check { display: flex; align-items: center; gap: .5rem; padding: .5rem 0; font-size: .85rem; }
      .check input { width: auto; accent-color: var(--hot); margin: 0; }
      .compare { margin-top: 1.1rem; padding-top: 1rem; border-top: 1px solid var(--edge); }
      .compare .row { margin-top: .6rem; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Radio</h1>
      <div class="sub">
        Rule-based music generator — nineteen genres, auditioned through Strudel ·
        <a href="/voice" style="color: var(--hot)">voice lab →</a> ·
        <a href="/mix" style="color: var(--hot)">mix lab →</a> ·
        <a href="/bench" style="color: var(--hot)">instrument bench →</a> ·
        <a href="/concert" style="color: var(--hot)">concert →</a>
      </div>

      <div class="panel">
        <div class="controls">
          <div>
            <label for="genre">Genre</label>
            <select id="genre"></select>
          </div>
          <div>
            <label for="mood">Mood</label>
            <select id="mood"></select>
          </div>
          <div>
            <label for="era">Era</label>
            <select id="era"></select>
          </div>
          <div>
            <label for="style">Style</label>
            <select id="style"></select>
          </div>
          <div>
            <label for="strictness">Smoothness</label>
            <select id="strictness"></select>
          </div>
          <div>
            <label for="hook">Hook</label>
            <select id="hook"></select>
          </div>
          <div>
            <label for="vocals">Voice</label>
            <select id="vocals"></select>
          </div>
          <div>
            <label for="seed">Seed</label>
            <input id="seed" type="text" placeholder="random" />
          </div>
          <!-- Chaos and its mixing rate are one control in two parts, so they
               share a row of their own rather than sitting in the grid, where
               the slider landed next to whatever happened to follow it. -->
          <div class="span chaos">
            <div>
              <label>Chaos — borrow from the other genres</label>
              <div id="chaos" class="checks">
                <button id="chaos-all" type="button" class="chip"
                        title="Every kind at once, mixing at 100% — press again to clear">full chaos</button>
              </div>
            </div>
            <!-- There is nothing to mix until a kind is ticked, so the whole
                 block is absent until then rather than sitting there dead. -->
            <div class="mixing-block" id="chaos-mix-block" hidden>
              <div class="mixing-head">
                Mixing
                <button id="chaos-advanced" type="button" class="chip mini"
                        title="One rate per kind, instead of one for all of them">advanced</button>
              </div>
              <div class="mixing" id="chaos-one">
                <input id="chaos-spread" type="range" min="0" max="100" step="5" value="50"
                       aria-label="Mixing" />
              </div>
              <!-- Advanced: the same slider once per ticked kind, filled by
                   `main.ts` from the same table the boxes are built from. -->
              <div class="mixing-grid" id="chaos-mixing" hidden></div>
              <!-- …and which seed the band comes from, which is a different
                   question from which seed the song comes from and was only
                   ever the same string by default. -->
              <div class="chaos-seed" id="chaos-seed-row" hidden>
                <label for="chaos-seed">Chaos seed</label>
                <input id="chaos-seed" type="text" placeholder="same as song"
                       title="Draw the band from this instead of the song's seed — the same piece, borrowed from somewhere else" />
              </div>
            </div>
          </div>
        </div>
        <div class="hint" id="strictness-hint"></div>
        <div class="hint" id="hook-hint"></div>
        <div class="row">
          <button id="play" class="primary" disabled>Loading…</button>
          <button id="next" disabled>Next ▸</button>
          <button id="radio" disabled>Radio mode: off</button>
          <button id="watch">Watch on stage ▸</button>
          <button id="dl" disabled>Download MIDI</button>
        </div>
        <div class="status" id="status"></div>
      </div>

      <div class="panel">
        <div class="now">
          <span class="title" id="title">—</span>
        </div>
        <div class="meta" id="meta"></div>
        <div class="form-strip" id="form"></div>
        <label class="layers-label">Layers — click to mute, live</label>
        <div class="layers" id="layers"></div>
        <details>
          <summary>Generated Strudel code</summary>
          <pre id="code"></pre>
        </details>
      </div>
    </div>
    <script type="module" src="/src/web/main.ts"></script>
  </body>
</html>
